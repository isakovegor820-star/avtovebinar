            schema: { type: string, format: binary }
      responses:
        '200': { description: Part fsynced, SHA-256 ETag returned and server checkpoint committed }
        '400': { description: Part number, MIME or exact byte length does not match server metadata }
        '401': { description: Platform session is absent or invalid }
        '403': { description: CSRF token is missing or invalid }
        '404': { description: Upload is unknown, cross-tenant or unrelated to this author }
        '409': { description: Upload is inactive or this part already has different content }
        '411': { description: Content-Length is required }
        '415': { description: MIME is missing or content encoding is unsupported }
        '429': { description: Self-hosted part rate limit exceeded }
        '503': { description: Private media storage is unavailable }
