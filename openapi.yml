      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMTagUpdate' }
      responses:
        '200': { description: Tag updated and audited }
        '400': { description: Strict tag payload validation failed }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: Unknown and cross-tenant tags are intentionally indistinguishable }
        '409': { description: Normalized tag name already exists in this tenant }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/contacts:
    get:
      summary: List tenant-scoped CRM contacts with combinable server filters
      description: ANALYST and AUDITOR receive masked personal data and cannot search raw personal fields. Unknown and foreign entity identifiers never expand the tenant scope.
      security:
        - userSessionCookie: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { in: query, name: search, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { in: query, name: webinarId, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { in: query, name: sessionId, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { in: query, name: stageId, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { in: query, name: managerId, schema: { type: string, minLength: 1, maxLength: 191 } }
        - {
            in: query,
            name: activity,
            schema: { type: string, enum: [registered, entered, viewed, question, cta, email, telegram, note] },
          }
        - { in: query, name: source, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { in: query, name: hasQuestion, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: hasCta, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: queue, schema: { type: string, enum: [today, overdue, without_task] } }
      responses:
        '200':
          description: Private no-store page of contacts in the server-selected tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMContactPage' }
        '400': { description: Strict query validation failed }
        '403': { description: Role cannot read CRM or attempted raw personal-data search }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM read rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/contacts/{contactId}:
    get:
      summary: Read one tenant CRM contact and unified server-time timeline
