groups:
  - name: aspb-recording
    interval: 30s
    rules:
      - record: aspb:http_requests:rate5m
        expr: sum(rate(aspb_http_requests_total[5m]))
      - record: aspb:http_errors:ratio5m
        expr: sum(rate(aspb_http_request_errors_total[5m])) / clamp_min(sum(rate(aspb_http_requests_total[5m])), 1)
      - record: aspb:http_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(aspb_http_request_duration_seconds_bucket[5m])))

  - name: aspb-alerts
    interval: 30s
    rules:
      - alert: AspbApiHighLatency
        expr: aspb:http_latency:p95_5m > 1
        for: 10m
        labels: { severity: warning, service: aspb-api, team: aspb-platform }
        annotations:
          summary: ASPB API p95 exceeds one second
          runbook: docs/production-runbook.md#capacity-load-and-restart-evidence
          recovery: Inspect slow routes, database saturation, and recent rollout changes.
      - alert: AspbApiHighErrorRate
        expr: aspb:http_errors:ratio5m > 0.01
        for: 5m
        labels: { severity: critical, service: aspb-api, team: aspb-platform }
        annotations:
          summary: ASPB API 5xx ratio exceeds one percent
          runbook: docs/production-runbook.md#rollback
          recovery: Stop the active rollout, inspect safe logs, and use application rollback if correlated with deploy.
      - alert: AspbDatabaseUnavailable
        expr: up{job="aspb-postgres"} == 0
        for: 2m
        labels: { severity: critical, service: aspb-database, team: aspb-platform }
        annotations:
          summary: ASPB PostgreSQL readiness probe is unavailable
          runbook: docs/production-runbook.md#backup
          recovery: Verify database health and network path; do not recreate storage or restore over the source.
      - alert: AspbDatabasePoolExhaustion
        expr: aspb_db_pool_waiting_connections > 0 and aspb_db_pool_idle_connections == 0
        for: 5m
        labels: { severity: critical, service: aspb-database, team: aspb-platform }
        annotations:
          summary: ASPB database pool has waiters and no idle connections
          runbook: docs/production-runbook.md#capacity-load-and-restart-evidence
          recovery: Reduce admitted load and inspect long transactions before changing pool limits.
      - alert: AspbWorkerHeartbeatStalled
        expr: time() - aspb_worker_subsystem_last_progress_timestamp_seconds > 300
        for: 2m
        labels: { severity: critical, service: aspb-worker, team: aspb-platform }
        annotations:
          summary: An ASPB worker subsystem has not made progress
          runbook: docs/production-runbook.md#capacity-load-and-restart-evidence
          recovery: Identify the subsystem label, inspect its current lease, and restart only after lease safety is confirmed.
      - alert: AspbQueueDepthHigh
        expr: max by (queue) (aspb_queue_depth) > 100
        for: 10m
        labels: { severity: warning, service: aspb-worker, team: aspb-platform }
        annotations:
          summary: An ASPB durable queue exceeds its review threshold
          runbook: docs/production-runbook.md#capacity-load-and-restart-evidence
          recovery: Check queue age, worker progress, and downstream provider state before scaling.
      - alert: AspbQueueOldestItemStale
        expr: max by (queue) (aspb_queue_oldest_item_age_seconds) > 900
        for: 5m
        labels: { severity: critical, service: aspb-worker, team: aspb-platform }
        annotations:
          summary: An ASPB queue contains a stale oldest item
          runbook: docs/production-runbook.md#capacity-load-and-restart-evidence
          recovery: Inspect claim expiry and retry state; preserve the durable row while recovering the worker.
      - alert: AspbDeadLetterGrowth
        expr: sum(increase(aspb_dead_letter_total[15m])) by (queue) > 0
        for: 1m
        labels: { severity: critical, service: aspb-worker, team: aspb-platform }
        annotations:
          summary: ASPB dead-letter count is growing
          runbook: docs/production-runbook.md#provider-failure-and-application-rollback
          recovery: Disable the affected rollout/provider and classify the safe error code before retrying.
      - alert: AspbMediaCapacityLow
        expr: (aspb_media_storage_bytes{state="available"} / aspb_media_storage_bytes{state="total"} < 0.15) or (aspb_media_storage_inodes{state="available"} / aspb_media_storage_inodes{state="total"} < 0.10)
        for: 10m
        labels: { severity: critical, service: aspb-media, team: aspb-platform }
        annotations:
          summary: ASPB private media storage bytes or inodes are low
          runbook: docs/production-runbook.md#media-stt-hardening-contract-23082026
          recovery: Stop new uploads, inspect incomplete multipart data, and follow approved cleanup only.
      - alert: AspbProviderOutage
        expr: sum(increase(aspb_provider_requests_total{result=~"rate_limited|5xx|timeout|cleanup_failed"}[10m])) by (provider, result) > 5
        for: 5m
        labels: { severity: critical, service: aspb-provider, team: aspb-platform }
        annotations:
          summary: ASPB provider errors exceed the operational threshold
          runbook: docs/production-runbook.md#provider-failure-and-application-rollback
          recovery: Turn off the provider master flag, preserve jobs, and verify cleanup receipts before resuming.
      - alert: AspbNotificationDeliveryFailures
        expr: sum(increase(aspb_notification_delivery_total{channel=~"smtp|telegram",result=~"failed|retry_after"}[10m])) by (channel, result) > 3
        for: 5m
        labels: { severity: warning, service: aspb-notifications, team: aspb-platform }
        annotations:
          summary: ASPB SMTP or Telegram delivery failures are elevated
          runbook: docs/production-runbook.md#rotation-secrets-after-unsafe-rights
          recovery: Verify provider availability and consent-safe retry state; do not log recipient identifiers.
      - alert: AspbAuthAnomaly
        expr: sum(increase(aspb_auth_outcomes_total{outcome=~"failed|rate_limited"}[10m])) by (outcome) > 50
        for: 5m
        labels: { severity: warning, service: aspb-auth, team: aspb-security }
        annotations:
          summary: ASPB authentication failures or rate limits are abnormal
          runbook: docs/production-runbook.md#rotation-secrets-after-unsafe-rights
          recovery: Review aggregate source patterns and rate controls without exposing account identifiers.
      - alert: AspbBackupTooOld
        expr: time() - aspb_backup_last_success_timestamp_seconds > 90000
        for: 10m
        labels: { severity: critical, service: aspb-backup, team: aspb-platform }
        annotations:
          summary: Latest ASPB backup is older than twenty-five hours
          runbook: docs/production-runbook.md#backup
          recovery: Run the guarded backup check and preserve the previous backup until validation completes.
      - alert: AspbRestoreDrillStale
        expr: time() - aspb_restore_drill_last_success_timestamp_seconds > 2678400
        for: 1h
        labels: { severity: warning, service: aspb-backup, team: aspb-platform }
        annotations:
          summary: ASPB isolated restore drill is older than thirty-one days
          runbook: docs/production-runbook.md#coordinated-postgresql-private-media-restore-drill
          recovery: Schedule an isolated restore drill without touching the source database or media prefix.
      - alert: AspbRolloutProviderAnomaly
        expr: sum(increase(aspb_rollout_blocked_operation_total[10m])) by (feature) > 20 or sum(increase(aspb_provider_jobs_started_total[10m])) by (provider) > 500
        for: 5m
        labels: { severity: warning, service: aspb-rollout, team: aspb-platform }
        annotations:
          summary: ASPB rollout blocks or provider job starts are anomalous
          runbook: docs/production-runbook.md#analytics-moderation-and-platform-governance-rollout
          recovery: Set the affected tenant policy to disabled and inspect audit revisions before re-enabling.
