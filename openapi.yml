        '404': { description: Unknown, cross-tenant or unauthorized Webinar }
  /api/v1/creator/webinars/{webinarId}/materials/uploads:
    post:
      summary: Start an idempotent multipart upload for an allowlisted private material
      description: Binds tenant, Webinar, name, MIME, exact size and optional SHA-256. Maximum size is 100 MiB; storage authority is short-lived.
      security: [{ userSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MaterialUploadCreateRequest' } } }
      responses:
        '201': { description: Upload intent and short-lived part operations created }
        '200': { description: Exact idempotent upload intent replayed }
        '404': { description: Unknown, cross-tenant or unauthorized Webinar }
        '409': { description: Idempotency conflict or Webinar is not editable }
        '413': { description: Material exceeds 100 MiB }
        '415': { description: Extension/MIME combination is not allowlisted }
  /api/v1/creator/material-uploads/{uploadId}/parts:
    post:
      summary: Record one provider-completed multipart part
      security: [{ userSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MultipartPartRequest' } } }
      responses:
        '200': { description: Part receipt recorded idempotently }
        '404': { description: Unknown, expired, foreign or unauthorized upload }
