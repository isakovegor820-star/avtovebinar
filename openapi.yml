  /api/v1/creator/webinars/{webinarId}/uploads:
    post:
      summary: Create a private resumable multipart video upload
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable per logical upload request. A replay with the same request contract returns the existing upload and freshly signed operations only for missing parts; a conflicting contract is rejected.
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName: { type: string, maxLength: 240 }
                mimeType: { type: string, enum: [video/mp4, video/quicktime, video/webm] }
                sizeBytes: { type: string, pattern: '^\\d{1,13}$' }
                checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          {
            description: Idempotent replay returned the existing asset/upload and fresh operations only for missing parts,
          }
        '201':
          {
            description: Asset and temporary provider or same-origin part operations created; origin key is not returned,
          }
        '400': { description: Invalid type, size or request contract }
        '404': { description: Webinar is unavailable in the active tenant }
        '409': { description: Idempotency-Key was already used with a different server-owned upload contract }
        '503': { description: Private object storage adapter is not configured }
  /api/v1/creator/uploads/{uploadId}/complete:
    post:
      summary: Idempotently complete a private multipart upload and enqueue validation
      description: Replays a provider-committed completion safely by verifying the object metadata before persisting one deduplicated job.
      security:
        - userSessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1, maximum: 10000 }
                      etag: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Upload completed and one deduplicated media job exists }
        '404': { description: Upload is unavailable in the active tenant }
        '409':
          { description: Client, server checkpoint and provider ListParts state disagree; completion was not attempted }
        '422': { description: Trusted signature, MIME, integrity or duration validation failed }
  /api/v1/creator/uploads/{uploadId}/parts:
    post:
      summary: Idempotently record one directly uploaded multipart part
      description: Stores only bounded part metadata. Provider size/checksum are reconciled through ListParts before resume/complete. External storage bytes bypass Express; self-hosted bytes use the separately authenticated streaming endpoint.
      security:
        - userSessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [partNumber, etag]
              properties:
                partNumber: { type: integer, minimum: 1, maximum: 10000 }
                etag: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Part checkpoint recorded and safe progress returned }
        '404': { description: Upload is unavailable in the active tenant }
        '409':
          {
            description: Upload is expired/completed/cancelled,
            or the same part number conflicts with the provider/server checkpoint,
          }
  /api/v1/creator/uploads/{uploadId}/parts/{partNumber}/content:
    put:
      summary: Stream one self-hosted multipart part into private persistent storage
      description: Requires the platform session, active tenant membership, creator-to-Webinar relation and double-submit CSRF token. Content-Length and MIME must match server-owned upload metadata. The path never grants access by itself and never exposes a filesystem path or storage key.
      security:
        - userSessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
        - name: partNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          video/mp4:
            schema: { type: string, format: binary }
          video/quicktime:
            schema: { type: string, format: binary }
