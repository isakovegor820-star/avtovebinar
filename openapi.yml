openapi: 3.0.3
info:
  title: ASPB Autowebinar API
  version: 1.0.0
servers:
  - url: /
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Runtime is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Core API and database are ready
        '503':
          description: Core API or database is unavailable
  /health/dependencies:
    get:
      summary: Public redacted external dependency component status
      responses:
        '200':
          description: SMTP, Telegram and email outbox component states are healthy; diagnostics are omitted
        '503':
          description: One or more named components are degraded; errors, counts, identities and configuration are omitted
  /health/dependencies/details:
    get:
      summary: Protected external dependency diagnostics
      security:
        - metricsBearer: []
      responses:
        '200':
          description: Detailed dependency checks
        '401':
          description: Metrics token is missing in production
        '403':
          description: Metrics token is invalid in production
  /metrics:
    get:
      summary: Prometheus metrics
      security:
        - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition
        '401':
          description: Metrics token is missing in production
        '403':
          description: Metrics token is invalid in production
  /api/register:
    post:
      summary: Start email-verified webinar registration
      description: >-
        Anonymous requests for new and existing email addresses deliberately receive the same
        generic 202 response and never receive a participant cookie. A 201 response is possible
        only when an already authenticated participant submits the same Lead identity.
      responses:
        '201':
          description: Same authenticated participant updated; participant session cookie refreshed
        '202':
          description: Generic email-verification/recovery response; no participant session is issued
        '400':
          description: Registration or consent payload is invalid
        '403':
          description: CSRF token is missing or invalid
  /api/registration/exchange:
    post:
      summary: Consume one-time email confirmation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Email ownership confirmed and HttpOnly participant session cookie issued
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Token is expired or already used
  /api/participant/login/request:
    post:
      summary: Request a passwordless participant recovery link
      description: The response is intentionally identical whether or not the email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Generic queued/retrying delivery state without email-existence disclosure
        '400':
          description: Email payload is invalid
        '403':
          description: CSRF token is missing or invalid
  /api/participant/login/consume:
    post:
      summary: Consume one-time participant recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: HttpOnly participant session cookie issued
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Token is expired or already used
  /api/v1/auth/passwordless/request:
    post:
      summary: Request a passwordless platform User login link
      description: >-
        Returns the same accepted response for known, unknown, disabled and organization-less
        addresses. Client-supplied organization identifiers are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessLoginRequest'
      responses:
        '202':
          description: Generic non-enumerating response; a durable email job may have been queued
        '400':
          description: Strict request payload validation failed
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Platform accounts compatibility flag is disabled
  /api/v1/auth/passwordless/consume:
    post:
      summary: Consume one-time platform User login token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Hash-backed HttpOnly User session cookie issued; eligible memberships returned
        '400':
          description: Strict request payload validation failed
        '401':
          description: Token is unknown, expired, wrong-purpose or already consumed
        '403':
          description: CSRF token is missing or invalid
  /api/v1/auth/session:
    get:
      summary: Read the current platform User session
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: User, active organization and server-resolved active memberships
        '401':
          description: User session is missing, expired, revoked or no longer eligible
  /api/v1/auth/active-organization:
    post:
      summary: Select one active organization from authenticated User memberships
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrganizationRequest'
      responses:
        '200':
          description: Active organization selected in the server-side session
        '401':
          description: User session is missing or invalid
        '404':
          description: Unknown and foreign organizations are intentionally indistinguishable
  /api/v1/auth/logout:
    post:
      summary: Revoke the current platform User session
      security:
        - userSessionCookie: []
      responses:
        '204':
          description: Current session revoked and cookie cleared
  /api/v1/auth/sessions/revoke-all:
    post:
      summary: Revoke all sessions for the authenticated platform User
      security:
        - userSessionCookie: []
      responses:
        '204':
          description: Session version incremented, sessions revoked and cookie cleared
  /api/v1/auth/mfa/verify:
    post:
      summary: Verify an MFA-challenged platform User session
      description: Until this succeeds, the session cannot read tenant data or call protected tenant endpoints.
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: Current session marked MFA-verified and tenant session summary returned
        '400':
          description: Strict OTP payload validation failed
        '401':
          description: Session or one-time code is invalid
  /api/v1/auth/mfa/enrollment/start:
    post:
      summary: Start a ten-minute owner MFA enrollment
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: One-time setup secret and otpauth URL returned with no-store caching
        '403':
          description: Active membership in the selected organization is not OWNER
        '409':
          description: MFA is already enabled
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      summary: Confirm owner MFA enrollment
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: MFA enabled, current session verified and other User sessions revoked
        '401':
          description: One-time code is invalid
        '403':
          description: Active membership in the selected organization is not OWNER
        '409':
          description: Enrollment is absent, expired or MFA is already enabled
  /api/v1/auth/mfa/disable:
    post:
      summary: Disable owner MFA after a fresh TOTP check
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: MFA secret removed and other User sessions revoked
        '401':
          description: Current session or one-time code is invalid
        '403':
          description: Active membership in the selected organization is not OWNER
  /api/v1/organization/invitations/accept:
    post:
      summary: Accept a role-bound one-time organization invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Membership created or reactivated and HttpOnly User session issued
        '401':
          description: Invitation is unknown, expired, revoked or already consumed
  /api/v1/webinar-invitations/accept:
    post:
      summary: Accept an email-bound private Webinar invitation
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Single-use token consumed and the authenticated verified User bound to the grant
        '400':
          description: Strict token payload validation failed
        '401':
          description: User session is missing, expired or MFA-challenged
        '404':
          description: Unknown, wrong-email, expired, revoked and already-used invitations are intentionally indistinguishable
  /api/v1/organizations:
    post:
      summary: Create the first organization for an authenticated verified User
      description: The server rejects Users who already have an active membership. Organization, active HUMAN OWNER membership, session tenant selection, audit and idempotency record commit atomically. This never creates a platform-admin identity.
      security:
        - userSessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreateRequest' }
      responses:
        '201': { description: Organization and OWNER membership created atomically }
        '200': { description: Same successful result replayed for the same idempotency key and payload }
        '400': { description: Strict payload, slug or idempotency contract failed }
        '401': { description: User session is missing, expired or MFA-challenged }
        '409': { description: Safe create conflict or idempotency key payload conflict }
        '429': { description: Production organization-creation rate limit exceeded }
  /api/v1/organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 191 }
    get:
      summary: Read safe settings for the server-selected organization
      security:
        - userSessionCookie: []
      responses:
        '200': { description: Owner-visible organization settings projection; private no-store response }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown and cross-tenant organizations are intentionally indistinguishable }
    patch:
      summary: Update safe organization settings with optimistic revision and idempotency
      security:
        - userSessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdateRequest' }
      responses:
        '200': { description: Settings updated and audited, or the exact idempotent response replayed }
        '400': { description: Strict payload, timezone or idempotency contract failed }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown and cross-tenant organizations are intentionally indistinguishable }
        '409': { description: Revision conflict or idempotency key payload conflict }
  /api/v1/organizations/{organizationId}/members:
    get:
      summary: List members in the server-selected organization with cursor pagination
      security:
        - userSessionCookie: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 191 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200': { description: Minimal access-management member projection and an optional nextCursor }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown and cross-tenant organizations are intentionally indistinguishable }
  /api/v1/organization/invitations:
    post:
      summary: Create an invitation in the server-selected organization
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
      responses:
        '201':
          description: Pending invitation and durable delivery job created atomically
        '403':
          description: Authenticated membership is not an active owner
        '409':
          description: The email already has an active membership
    get:
      summary: List invitations in the server-selected organization
      security:
        - userSessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 191 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Tenant-scoped invitation list; expired pending rows are marked expired
        '403':
          description: Authenticated membership is not an active owner
  /api/v1/organization/invitations/{invitationId}:
    delete:
      summary: Revoke a pending invitation in the server-selected organization
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation revoked, active token hashes invalidated and delivery cancelled when possible
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant invitations are intentionally indistinguishable
  /api/v1/organization/memberships/{membershipId}/role:
    patch:
      summary: Change a membership role in the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleRequest'
      responses:
        '200':
          description: Membership updated and audited atomically
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant memberships are intentionally indistinguishable
        '409':
          description: Mutation would remove the last available active human owner
  /api/v1/organization/memberships/{membershipId}:
    delete:
      summary: Remove a membership from the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Membership removed and audited atomically
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant memberships are intentionally indistinguishable
        '409':
          description: Mutation would remove the last available active human owner
  /api/v1/author-profile:
    get:
      summary: Read the current author's tenant-scoped profile and verification state
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Safe author-facing profile, evidence metadata and latest public review comment
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
    patch:
      summary: Save a strict tenant-scoped author profile draft
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorProfileDraft'
      responses:
        '200':
          description: Draft saved and audited
        '400':
          description: Strict payload validation failed
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
        '409':
          description: Profile state is not editable
  /api/v1/author-verification:
    post:
      summary: Submit the complete author profile and private evidence for manual review
      security:
        - userSessionCookie: []
      responses:
        '201':
          description: Immutable review submission created and audited
        '400':
          description: Required profile fields or evidence are missing
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
        '409':
          description: Profile state cannot be submitted
  /api/v1/author-verification/evidence:
    post:
      summary: Upload one private author verification document
      description: Maximum 5 MiB; PDF, JPEG or PNG only; MIME and magic bytes are both validated.
      security:
        - userSessionCookie: []
      parameters:
        - name: x-evidence-kind
          in: header
          required: true
          schema:
            type: string
            enum: [LICENSE, DIPLOMA, BAR_MEMBERSHIP, OTHER]
        - name: x-evidence-filename
          in: header
          required: true
          schema:
            type: string
            maxLength: 720
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Private document stored and only non-content metadata returned
        '400':
          description: Metadata, MIME type or content signature is invalid
        '413':
          description: Upload exceeds 5 MiB
  /api/v1/author-verification/evidence/{evidenceId}:
    get:
      summary: Download the current author's private verification document
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Private no-store attachment
        '404':
          description: Unknown and cross-tenant evidence are intentionally indistinguishable
    delete:
      summary: Delete an unsubmitted private verification document
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Unsubmitted evidence deleted and audited
        '404':
          description: Unknown and cross-tenant evidence are intentionally indistinguishable
        '409':
          description: Submitted evidence is immutable
  /api/v1/catalog/webinars:
    get:
      summary: List eligible public legal Webinars
      description: Returns only published PUBLIC Webinars of verified active authors with an active OWNER/AUTHOR membership. UNLISTED, PRIVATE, draft and archived records are excluded.
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 160 } }
        - { in: query, name: practiceArea, schema: { type: string } }
        - { in: query, name: specialization, schema: { type: string } }
        - { in: query, name: jurisdiction, schema: { type: string } }
        - { in: query, name: level, schema: { type: string, enum: [INTRODUCTORY, PRACTITIONER, ADVANCED, ALL_LEVELS] } }
        - { in: query, name: format, schema: { type: string, enum: [RECORDED, PREMIERE, ON_DEMAND] } }
        - { in: query, name: availability, schema: { type: string, enum: [ALL, UPCOMING, RECORDING], default: ALL } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - {
            in: query,
            name: sort,
            schema: { type: string, enum: [RELEVANCE, UPCOMING, NEWEST, UPDATED], default: UPCOMING },
          }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        '200':
          description: Redacted public catalog projection and pagination
        '400':
          description: Query validation failed
        '404':
          description: Public catalog rollout flag is disabled
  /api/v1/catalog/search:
    get:
      summary: Search eligible public legal Webinars
      description: Alias of the catalog list contract; closed content is never searched or returned.
      responses:
        '200':
          description: Redacted public search results
        '400':
          description: Query validation failed
        '404':
          description: Public catalog rollout flag is disabled
  /api/v1/catalog/webinars/{slug}:
    get:
      summary: Read a PUBLIC or direct-link UNLISTED Webinar page
      description: PRIVATE, draft and archived records deliberately return the same safe 404 as an unknown slug. Organization slug disambiguates tenant-local Webinar slugs.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: organization
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Public legal Webinar projection; old aliases identify their canonical slug and superseded records may link to an eligible successor
        '400':
          description: Path or query validation failed
        '404':
          description: Unknown, closed, archived or ineligible Webinar
  /api/v1/catalog/webinars/{slug}/register:
    post:
      summary: Register for the exact public catalog WebinarSession
      description: >-
        Resolves Organization, Webinar and WebinarSession from the published server-side catalog
        graph. Client-supplied organizationId is rejected. Anonymous and existing-mailbox requests
        receive the same non-enumerating 202 response; an authenticated matching participant may
        receive an immediate 201 and HttpOnly room cookie. Replays are idempotent for the same
        normalized email and session and do not synthesize Lead or CRM events.
      security:
        - {}
        - participantSessionCookie: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: organization
          required: true
          description: Public organization slug used only to resolve the published tenant graph.
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogRegistrationRequest' }
      responses:
        '201':
          description: Same authenticated viewer registered; trusted scoped registration and room cookie issued
        '202':
          description: Generic verification or recovery response without mailbox-existence disclosure
        '400':
          description: Strict payload, consent or CSRF validation failed
        '404':
          description: Unknown, cross-tenant, wrong-session, closed or rollout-disabled target
  /api/v1/viewer/dashboard:
    get:
      summary: Read the current viewer account in the cookie-selected tenant
      description: Returns upcoming, recording, watched, saved and unavailable sections with progress, replay expiry and timezone. A favorite never grants access.
      security:
        - participantSessionCookie: []
      responses:
        '200': { description: Private no-store viewer dashboard }
        '404': { description: Missing legacy scope, unknown viewer or inaccessible tenant }
  /api/v1/viewer/registrations/{registrationId}/activate:
    post:
      summary: Select one owned registration and issue a fresh room session cookie
      security:
        - participantSessionCookie: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Same-user, same-tenant active registration selected }
        '404': { description: Unknown, cross-tenant, expired, revoked or unavailable registration }
  /api/v1/viewer/favorites/{webinarId}:
    put:
      summary: Idempotently save an eligible Webinar without changing access
      security:
        - participantSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Favorite exists for this User and tenant }
        '404': { description: Unknown, cross-tenant or inaccessible private Webinar }
    delete:
      summary: Idempotently remove an owned favorite
      security:
        - participantSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Favorite is absent }
        '404': { description: Viewer context is missing or unscoped }
  /api/v1/viewer/progress/{sessionId}:
    get:
      summary: Read the current viewer's position for one owned WebinarSession
      security:
        - participantSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarSessionId'
      responses:
        '200': { description: Private no-store progress or null }
        '404': { description: Unknown, cross-tenant or unowned session }
    put:
      summary: Deduplicate and throttle a server-owned viewing-progress update
      description: Hidden browser tabs do not write. The server deduplicates eventId and throttles immaterial updates while accepting material seeks and completion.
      security:
        - participantSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarSessionId'
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerProgressWrite' }
      responses:
        '200': { description: Update or exact duplicate accepted }
        '202': { description: Immaterial write throttled; retryAfterMs returned }
        '404': { description: Unknown, cross-tenant or unowned session }
  /api/v1/viewer/notes:
    get:
      summary: List private timestamped notes for one owned WebinarSession
      security:
        - participantSessionCookie: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '200': { description: Private no-store notes visible only to this User and tenant }
        '404': { description: Unknown, cross-tenant or unowned session }
    post:
      summary: Create one private timestamped viewer note
      security:
        - participantSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerNoteCreate' }
      responses:
        '201': { description: Private note created in the trusted session scope }
        '404': { description: Unknown, cross-tenant or unowned session }
  /api/v1/viewer/notes/{noteId}:
    delete:
      summary: Delete one note owned by the current viewer
      security:
        - participantSessionCookie: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Owned note deleted }
        '404': { description: Unknown and foreign notes are intentionally indistinguishable }
  /api/v1/viewer/notifications:
    get:
      summary: Read viewer notification preferences without mutating storage
      security:
        - participantSessionCookie: []
      responses:
        '200': { description: Private no-store marketing and service channel preferences }
        '404': { description: Viewer context is missing or unscoped }
    patch:
      summary: Update marketing and service notification channels independently
      description: Marketing changes append consent evidence and update the compatibility Lead; personal-data consent and mandatory legal delivery bases are not revoked.
      security:
        - participantSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerNotificationPatch' }
      responses:
        '200': { description: Preferences saved and consent evidence appended when marketing changed }
        '404': { description: Viewer context is missing or unscoped }
  /api/v1/crm/reference-data:
    get:
      summary: Read tenant-scoped CRM pipelines, stages, managers and role capabilities
      description: The organization is resolved only from the authenticated User session and active membership. CRM_MANAGER and OWNER receive writable capabilities; ANALYST and AUDITOR receive masked read-only capabilities.
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Private no-store CRM reference data for the server-selected tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMReferenceData' }
        '401': { description: User session is missing, expired or MFA-challenged }
        '403': { description: Active membership role cannot read CRM }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM read rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/bulk-actions:
    post:
      summary: Preview or execute one tenant-scoped CRM bulk action
      description: OWNER or CRM_MANAGER only. PREVIEW stores the exact filtered contact-id snapshot for ten minutes (maximum 1000); EXECUTE accepts only that server-side preview id and returns per-contact successes and safe failure codes. The organization is resolved from the active membership, and foreign/unknown targets are indistinguishable.
      security:
        - userSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMBulkActionRequest' }
      responses:
        '200':
          description: Idempotent preview replay, execution result, or terminal execution replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMBulkActionResponse' }
        '201':
          description: Exact preview snapshot created and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMBulkActionResponse' }
        '400':
          { description: Strict filter/action validation failed, selection exceeds 1000, or lost reason is missing }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: Unknown and cross-tenant preview/action targets are intentionally indistinguishable }
        '409': { description: Preview expired, is already running, or idempotency key conflicts }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/exports:
    post:
      summary: Download a permissioned tenant CRM CSV for the current filters
      description: Requires an explicit active-membership permission `{crm:{export:true}}` in addition to a CRM read role. The response is private/no-store, capped at 10000 contacts and never retained as a platform file; ANALYST and AUDITOR values remain masked. Spreadsheet formula prefixes are escaped and every successful export is audited without contact data.
      security:
        - userSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMExportRequest' }
      responses:
        '200':
          description: One-time UTF-8 CSV response; x-crm-export-row-count and x-crm-export-audit-id are returned
          headers:
            Cache-Control: { schema: { type: string, example: 'private, no-store' } }
            x-crm-export-row-count: { schema: { type: integer, minimum: 0 } }
            x-crm-export-audit-id: { schema: { type: string } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { description: Strict filter validation failed or selection exceeds 10000 }
        '403': { description: CRM read role or explicit export permission is missing }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/queues:
    get:
      summary: Read server-computed tenant CRM task queue counts
      description: Today is calculated in the default pipeline IANA timezone. Overdue tasks are strictly before server time; without-task contains active OPEN-stage contacts with no OPEN task.
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Private no-store Today, Overdue, Without task and due-reminder counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMQueueSummary' }
        '401': { description: User session is missing, expired or MFA-challenged }
        '403': { description: Active membership role cannot read CRM }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM read rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/scoring:
    get:
      summary: Read tenant CRM scoring versions and the active explainable rule set
      description: Rules and versions are scoped to the organization resolved from the active membership. No client organization identifier is accepted.
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Active and archived scoring versions for the server-selected tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMScoringConfiguration' }
        '403': { description: Active membership role cannot read CRM }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM read rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/scoring/versions:
    post:
      summary: Create and atomically activate a new tenant scoring version
      description: OWNER only. The previous active version is archived and contact scores are recalculated from immutable, deduplicated factors; no factor is invented or duplicated.
      security:
        - userSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMScoringVersionCreate' }
      responses:
        '200': { description: Idempotent replay of the previously created version }
        '201': { description: New version created, activated and audited }
        '400': { description: Strict scoring payload validation failed }
        '403': { description: Active membership is not OWNER }
        '404': { description: CRM rollout flag is disabled }
        '409': { description: Idempotency key conflicts with another operation }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/tags:
    get:
      summary: List tags in the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - { in: query, name: includeArchived, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
      responses:
        '200':
          description: Tenant-scoped tag collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMTagCollection' }
        '403': { description: Active membership role cannot read CRM }
        '404': { description: CRM rollout flag is disabled }
        '429': { description: CRM read rate limit exceeded; machine-readable code and correlationId returned }
    post:
      summary: Create a normalized tenant CRM tag
      security:
        - userSessionCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMTagCreate' }
      responses:
        '201': { description: Tag created and audited inside the selected tenant }
        '400': { description: Strict tag payload validation failed }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: CRM rollout flag is disabled }
        '409': { description: Normalized tag name already exists in this tenant }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
  /api/v1/crm/tags/{tagId}:
    patch:
      summary: Rename, recolor, archive or reactivate one tenant CRM tag
      description: Unknown and foreign tags are indistinguishable. Used tags are archived instead of physically deleted.
      security:
        - userSessionCookie: []
      parameters:
