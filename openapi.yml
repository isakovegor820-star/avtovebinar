          { description: Invalid transition or optimistic revision conflict; rejected mutation creates no event/audit }
  /api/admin/moderation/reports/{id}/actions:
    post:
      summary: Unpublish/restore a Webinar or suspend/restore an author
      description: Requires MFA platform owner/admin authorization, reason, explicit confirmation and both report/target revisions. Existing evidence, CRM and analytics are preserved.
      security: [{ adminSessionCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, maxLength: 191 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModerationPlatformActionRequest' } } }
      responses:
        '200': { description: Reversible action and audit committed atomically }
