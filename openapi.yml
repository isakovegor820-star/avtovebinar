  /api/v1/crm/contacts/{contactId}/deliveries:
    post:
      summary: Enqueue one consent-aware tenant CRM marketing delivery
      description: OWNER and CRM_MANAGER only. The server resolves the tenant from the active membership, verifies the exact contact registration, Webinar and WebinarSession, and requires current channel consent both now and immediately before provider send. Recipient addresses, Telegram chat identifiers and message content are never returned.
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CRMContactId'
        - name: x-csrf-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMDeliveryCreate' }
      responses:
        '200':
          description: Idempotent replay of the same delivery request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMDeliveryResponse' }
        '201':
          description: Consent-checked delivery queued with tenant audit and timeline event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMDeliveryResponse' }
        '400': { description: Strict channel payload or idempotency validation failed }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: Unknown and cross-tenant contacts or registrations are intentionally indistinguishable }
        '409': { description: Consent, recipient, Telegram binding or idempotency requirement failed }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
