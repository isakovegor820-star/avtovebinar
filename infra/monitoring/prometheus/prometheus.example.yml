global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/aspb.rules.yml
scrape_configs:
  - job_name: aspb-api
    scheme: https
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/aspb_metrics_token
    static_configs:
      - targets: [staging-api.placeholder.invalid]
  - job_name: aspb-postgres
    static_configs:
      - targets: [staging-postgres-exporter.placeholder.invalid]
