  /api/admin/moderation/reports/{id}/correction-requests:
    post:
      summary: Request a reasoned human-reviewed Webinar correction
      security: [{ adminSessionCookie: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, maxLength: 191 } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionRequestCommand' } } }
      responses:
        '201': { description: Immutable correction request created; explicit visibility decision applied }
        '409': { description: Report revision conflict }
  /api/admin/moderation/corrections/{id}/review:
    post:
      summary: Approve or reject a submitted Webinar revision after human review
      security: [{ adminSessionCookie: [] }]
