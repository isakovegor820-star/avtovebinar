      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CRMDeliveryRetry' }
      responses:
        '200':
          description: Retry requested or idempotently replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMDeliveryResponse' }
        '400': { description: Strict idempotency payload validation failed }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: Unknown and cross-tenant deliveries are intentionally indistinguishable }
        '409': { description: Delivery state, current consent, recipient or original requester prevents retry }
        '429': { description: CRM mutation rate limit exceeded; machine-readable code and correlationId returned }
