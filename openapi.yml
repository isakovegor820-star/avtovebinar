        '409': { description: Segment exceeds the bounded 2000-recipient limit }
        '503': { description: Manual broadcast provider path is disabled }
  /api/v1/telegram/broadcasts/confirm:
    post:
      summary: Separately confirm and enqueue one previewed Telegram broadcast
      description: OWNER only. The server verifies the hash-only preview token, expiry, creator membership and unchanged exact segment snapshot before creating a durable job and recipients.
      security:
        - userSessionCookie: []
      parameters:
        - { name: x-csrf-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewId, previewToken, confirm, idempotencyKey]
              properties:
                previewId: { type: string, minLength: 1, maxLength: 191 }
                previewToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                confirm: { type: boolean, enum: [true] }
                idempotencyKey: { type: string, format: uuid }
      responses:
        '200': { description: Idempotent replay returns the original tenant job }
        '202': { description: Durable job accepted; current consent will be rechecked before every send }
        '403': { description: Active membership is not OWNER }
        '404': { description: Invalid/expired/consumed/foreign preview is intentionally unavailable }
        '409': { description: Segment snapshot changed and a new preview is required }
  /api/v1/telegram/broadcasts:
    get:
      summary: List tenant Telegram broadcast progress
      description: OWNER or CRM_MANAGER. Projection excludes template text, recipient chat IDs and provider errors.
      security:
        - userSessionCookie: []
      responses:
        '200': { description: Private no-store job status, attempts and aggregate progress }
        '403': { description: Active membership is not OWNER or CRM_MANAGER }
        '404': { description: Tenant Telegram rollout is disabled }
  /api/v1/telegram/broadcasts/{jobId}/pause:
    post:
      summary: Pause or request pause of a tenant Telegram broadcast
      security:
        - userSessionCookie: []
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { name: x-csrf-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [confirm],
                properties: { confirm: { type: boolean, enum: [true] } },
              }
      responses:
        '200': { description: Paused job/request and idempotent replay indicator }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown, foreign or terminal jobs are intentionally indistinguishable }
  /api/v1/telegram/broadcasts/{jobId}/resume:
    post:
      summary: Resume a paused tenant Telegram broadcast
      security:
        - userSessionCookie: []
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { name: x-csrf-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [confirm],
                properties: { confirm: { type: boolean, enum: [true] } },
              }
      responses:
        '200': { description: Pending job and idempotent replay indicator }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown, foreign or non-paused jobs are intentionally indistinguishable }
  /api/v1/telegram/broadcasts/{jobId}/cancel:
    post:
      summary: Cancel or request cancellation of a tenant Telegram broadcast
      description: OWNER only. A currently claimed send is allowed to settle; unsent recipients remain unsent and history is retained.
      security:
        - userSessionCookie: []
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 191 } }
        - { name: x-csrf-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Cancelled job/request and idempotent replay indicator }
        '403': { description: Active membership is not OWNER }
        '404': { description: Unknown, foreign or terminal jobs are intentionally indistinguishable }
  /api/v1/analytics/overview:
    get:
      summary: Read tenant-scoped Webinar analytics formulas and metrics
      description: Tenant is derived from the authenticated User session. organizationId, when present, is ignored as authority. Only schemaVersion 1 trusted data is projected; periods use UTC and `to` is inclusive by calendar day.
      security: [{ userSessionCookie: [] }]
      parameters:
        - { in: query, name: webinarId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: sessionId, schema: { type: string, maxLength: 191 } }
        - {
            in: query,
            name: source,
            schema:
              { type: string, enum: [web, room, replay, registration, crm, email, telegram, worker, system, admin] },
          }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - {
            in: query,
            name: organizationId,
            schema: { type: string },
            description: Untrusted compatibility hint; never selects the tenant.,
          }
      responses:
        '200':
          {
            description: Textual formulas,
            UTC period,
            data-quality policy and registrations,
            entry,
            live/replay,
            watch,
            completion,
            question and CTA metrics,
          }
        '401': { description: User session is missing or invalid }
        '403': { description: Membership role cannot read tenant analytics }
        '404':
          {
            description: Unknown and cross-tenant Webinar or Session are intentionally indistinguishable,
            or rollout is disabled,
          }
  /api/v1/analytics/retention:
    get:
      summary: Read privacy-thresholded video retention intervals
      description: Visible playing heartbeats are grouped by a stable server-trusted identity. Repeat heartbeats and backward seeks do not create viewers; positions are clamped to actual Session duration and LIVE/REPLAY are explicit.
      security: [{ userSessionCookie: [] }]
      parameters:
        - { in: query, name: playback, required: true, schema: { type: string, enum: [LIVE, REPLAY] } }
        - { in: query, name: webinarId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: sessionId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Ten percent intervals with small nonzero cohorts suppressed below privacyThreshold }
        '403': { description: Membership role cannot read tenant analytics }
        '404': { description: Unknown and cross-tenant scope is intentionally indistinguishable }
  /api/v1/analytics/live:
    get:
      summary: Read actually active tenant viewer sessions
      description: Counts distinct visible playing heartbeats inside the server-defined 45-second activity window. Synthetic viewers are never included; response documents its refresh delay.
      security: [{ userSessionCookie: [] }]
      parameters:
        - { in: query, name: webinarId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: sessionId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: source, schema: { type: string } }
      responses:
        '200': { description: Active viewer count, activity algorithm, window and refresh-delay metadata }
        '403': { description: Membership role cannot read tenant analytics }
        '404': { description: Unknown and cross-tenant scope is intentionally indistinguishable }
  /api/v1/analytics/content:
    get:
      summary: Read chapter and transcript-search aggregates
      description: Uses only the currently published transcript and returns no row below the privacy threshold. Raw unsafe search text is rejected before persistence and never logged.
      security: [{ userSessionCookie: [] }]
      parameters:
        - { in: query, name: webinarId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: sessionId, schema: { type: string, maxLength: 191 } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Tenant-scoped popular chapters and normalized safe transcript searches }
        '403': { description: Membership role cannot read tenant analytics }
        '404': { description: Unknown and cross-tenant scope is intentionally indistinguishable }
  /api/v1/reports:
    post:
      summary: Submit a public content, author or rights report
      description: The server resolves a trusted published target, sanitizes the narrative, hashes optional reporter contact and returns no reporter identity. Private, foreign and unknown targets are indistinguishable. Rate limited to five requests per fifteen minutes outside tests.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicContentReportRequest' } } }
      responses:
        '201': { description: Minimal report receipt with server time, initial status and correlation ID }
        '400': { description: Strict Zod validation failed }
        '403': { description: CSRF token is missing or invalid }
        '404': { description: Target unavailable or public reporting rollout disabled }
        '429': { description: Public report rate limit exceeded }
  /api/v1/moderation/corrections:
    get:
      summary: List correction requests in the server-selected tenant
      security: [{ userSessionCookie: [] }]
      responses:
        '200':
          {
            description: OWNER sees tenant requests; AUTHOR sees only authored Webinar requests and latest revision status,
          }
        '403': { description: Active membership is not OWNER or AUTHOR }
  /api/v1/moderation/corrections/{requestId}/submissions:
    post:
      summary: Submit an immutable Webinar correction revision for human review
      security: [{ userSessionCookie: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, minLength: 1, maxLength: 191 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionSubmissionRequest' } } }
      responses:
        '201': { description: Private submitted revision; current public Webinar content is unchanged }
        '403': { description: Active membership is not OWNER or AUTHOR }
        '404': { description: Unknown and cross-tenant request are intentionally indistinguishable }
        '409': { description: Request, content version or optimistic revision changed }
  /api/admin/moderation/reports:
    get:
      summary: List platform moderation reports
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ModerationCaseStatus' } }
        - { in: query, name: organizationId, schema: { type: string, maxLength: 191 } }
