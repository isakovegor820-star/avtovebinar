openapi: 3.0.3
info:
  title: ASPB Autowebinar API
  version: 1.0.0
servers:
  - url: /
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Runtime is alive
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Core API and database are ready
        '503':
          description: Core API or database is unavailable
  /health/dependencies:
    get:
      summary: Public redacted external dependency component status
      responses:
        '200':
          description: SMTP, Telegram and email outbox component states are healthy; diagnostics are omitted
        '503':
          description: One or more named components are degraded; errors, counts, identities and configuration are omitted
  /health/dependencies/details:
    get:
      summary: Protected external dependency diagnostics
      security:
        - metricsBearer: []
      responses:
        '200':
          description: Detailed dependency checks
        '401':
          description: Metrics token is missing in production
        '403':
          description: Metrics token is invalid in production
  /metrics:
    get:
      summary: Prometheus metrics
      security:
        - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition
        '401':
          description: Metrics token is missing in production
        '403':
          description: Metrics token is invalid in production
  /api/register:
    post:
      summary: Start email-verified webinar registration
      description: >-
        Anonymous requests for new and existing email addresses deliberately receive the same
        generic 202 response and never receive a participant cookie. A 201 response is possible
        only when an already authenticated participant submits the same Lead identity.
      responses:
        '201':
          description: Same authenticated participant updated; participant session cookie refreshed
        '202':
          description: Generic email-verification/recovery response; no participant session is issued
        '400':
          description: Registration or consent payload is invalid
        '403':
          description: CSRF token is missing or invalid
  /api/registration/exchange:
    post:
      summary: Consume one-time email confirmation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Email ownership confirmed and HttpOnly participant session cookie issued
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Token is expired or already used
  /api/participant/login/request:
    post:
      summary: Request a passwordless participant recovery link
      description: The response is intentionally identical whether or not the email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Generic queued/retrying delivery state without email-existence disclosure
        '400':
          description: Email payload is invalid
        '403':
          description: CSRF token is missing or invalid
  /api/participant/login/consume:
    post:
      summary: Consume one-time participant recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: HttpOnly participant session cookie issued
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Token is expired or already used
  /api/v1/auth/passwordless/request:
    post:
      summary: Request a passwordless platform User login link
      description: >-
        Returns the same accepted response for known, unknown, disabled and organization-less
        addresses. Client-supplied organization identifiers are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessLoginRequest'
      responses:
        '202':
          description: Generic non-enumerating response; a durable email job may have been queued
        '400':
          description: Strict request payload validation failed
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Platform accounts compatibility flag is disabled
  /api/v1/auth/passwordless/consume:
    post:
      summary: Consume one-time platform User login token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Hash-backed HttpOnly User session cookie issued; eligible memberships returned
        '400':
          description: Strict request payload validation failed
        '401':
          description: Token is unknown, expired, wrong-purpose or already consumed
        '403':
          description: CSRF token is missing or invalid
  /api/v1/auth/session:
    get:
      summary: Read the current platform User session
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: User, active organization and server-resolved active memberships
        '401':
          description: User session is missing, expired, revoked or no longer eligible
  /api/v1/auth/active-organization:
    post:
      summary: Select one active organization from authenticated User memberships
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrganizationRequest'
      responses:
        '200':
          description: Active organization selected in the server-side session
        '401':
          description: User session is missing or invalid
        '404':
          description: Unknown and foreign organizations are intentionally indistinguishable
  /api/v1/auth/logout:
    post:
      summary: Revoke the current platform User session
      security:
        - userSessionCookie: []
      responses:
        '204':
          description: Current session revoked and cookie cleared
  /api/v1/auth/sessions/revoke-all:
    post:
      summary: Revoke all sessions for the authenticated platform User
      security:
        - userSessionCookie: []
      responses:
        '204':
          description: Session version incremented, sessions revoked and cookie cleared
  /api/v1/auth/mfa/verify:
    post:
      summary: Verify an MFA-challenged platform User session
      description: Until this succeeds, the session cannot read tenant data or call protected tenant endpoints.
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: Current session marked MFA-verified and tenant session summary returned
        '400':
          description: Strict OTP payload validation failed
        '401':
          description: Session or one-time code is invalid
  /api/v1/auth/mfa/enrollment/start:
    post:
      summary: Start a ten-minute owner MFA enrollment
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: One-time setup secret and otpauth URL returned with no-store caching
        '403':
          description: Active membership in the selected organization is not OWNER
        '409':
          description: MFA is already enabled
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      summary: Confirm owner MFA enrollment
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: MFA enabled, current session verified and other User sessions revoked
        '401':
          description: One-time code is invalid
        '403':
          description: Active membership in the selected organization is not OWNER
        '409':
          description: Enrollment is absent, expired or MFA is already enabled
  /api/v1/auth/mfa/disable:
    post:
      summary: Disable owner MFA after a fresh TOTP check
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaOtpRequest'
      responses:
        '200':
          description: MFA secret removed and other User sessions revoked
        '401':
          description: Current session or one-time code is invalid
        '403':
          description: Active membership in the selected organization is not OWNER
  /api/v1/organization/invitations/accept:
    post:
      summary: Accept a role-bound one-time organization invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Membership created or reactivated and HttpOnly User session issued
        '401':
          description: Invitation is unknown, expired, revoked or already consumed
  /api/v1/organization/invitations:
    post:
      summary: Create an invitation in the server-selected organization
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
      responses:
        '201':
          description: Pending invitation and durable delivery job created atomically
        '403':
          description: Authenticated membership is not an active owner
        '409':
          description: The email already has an active membership
    get:
      summary: List invitations in the server-selected organization
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Tenant-scoped invitation list; expired pending rows are marked expired
        '403':
          description: Authenticated membership is not an active owner
  /api/v1/organization/invitations/{invitationId}:
    delete:
      summary: Revoke a pending invitation in the server-selected organization
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation revoked, active token hashes invalidated and delivery cancelled when possible
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant invitations are intentionally indistinguishable
  /api/v1/organization/memberships/{membershipId}/role:
    patch:
      summary: Change a membership role in the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleRequest'
      responses:
        '200':
          description: Membership updated and audited atomically
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant memberships are intentionally indistinguishable
        '409':
          description: Mutation would remove the last available active human owner
  /api/v1/organization/memberships/{membershipId}:
    delete:
      summary: Remove a membership from the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Membership removed and audited atomically
        '403':
          description: Authenticated membership is not an active owner
        '404':
          description: Unknown and cross-tenant memberships are intentionally indistinguishable
        '409':
          description: Mutation would remove the last available active human owner
  /api/v1/author-profile:
    get:
      summary: Read the current author's tenant-scoped profile and verification state
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Safe author-facing profile, evidence metadata and latest public review comment
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
    patch:
      summary: Save a strict tenant-scoped author profile draft
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorProfileDraft'
      responses:
        '200':
          description: Draft saved and audited
        '400':
          description: Strict payload validation failed
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
        '409':
          description: Profile state is not editable
  /api/v1/author-verification:
    post:
      summary: Submit the complete author profile and private evidence for manual review
      security:
        - userSessionCookie: []
      responses:
        '201':
          description: Immutable review submission created and audited
        '400':
          description: Required profile fields or evidence are missing
        '403':
          description: Active tenant membership is not OWNER or AUTHOR
        '409':
          description: Profile state cannot be submitted
  /api/v1/author-verification/evidence:
    post:
      summary: Upload one private author verification document
      description: Maximum 5 MiB; PDF, JPEG or PNG only; MIME and magic bytes are both validated.
      security:
        - userSessionCookie: []
      parameters:
        - name: x-evidence-kind
          in: header
          required: true
          schema:
            type: string
            enum: [LICENSE, DIPLOMA, BAR_MEMBERSHIP, OTHER]
        - name: x-evidence-filename
          in: header
          required: true
          schema:
            type: string
            maxLength: 720
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Private document stored and only non-content metadata returned
        '400':
          description: Metadata, MIME type or content signature is invalid
        '413':
          description: Upload exceeds 5 MiB
  /api/v1/author-verification/evidence/{evidenceId}:
    get:
      summary: Download the current author's private verification document
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Private no-store attachment
        '404':
          description: Unknown and cross-tenant evidence are intentionally indistinguishable
    delete:
      summary: Delete an unsubmitted private verification document
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Unsubmitted evidence deleted and audited
        '404':
          description: Unknown and cross-tenant evidence are intentionally indistinguishable
        '409':
          description: Submitted evidence is immutable
  /api/v1/catalog/authors/{authorSlug}:
    get:
      summary: Read the public projection of a verified active author
      parameters:
        - $ref: '#/components/parameters/AuthorSlug'
      responses:
        '200':
          description: Public profile without email, internal notes or verification documents
        '404':
          description: Profile is absent, unverified, suspended or inactive
  /api/v1/creator/reference-data:
    get:
      summary: List active legal practice areas and jurisdictions for the authenticated creator
      security:
        - userSessionCookie: []
      responses:
        '200':
          description: Active reference data without tenant or personal data
        '403':
          description: Active membership is not OWNER or AUTHOR
        '404':
          description: Creator dashboard feature flag is disabled
  /api/v1/creator/webinars:
    get:
      summary: List Webinars in the server-selected tenant
      security:
        - userSessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, NEEDS_REVIEW, READY, IN_MODERATION, PUBLISHED, ARCHIVED]
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 191
      responses:
        '200':
          description: Cursor page scoped to the active tenant and author policy
        '403':
          description: Active membership is not OWNER or AUTHOR
    post:
      summary: Create a tenant-scoped Webinar draft for the authenticated author
      security:
        - userSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorWebinarCreate'
      responses:
        '201':
          description: Draft created and audited; independent media, transcript and scenario states start empty
        '400':
          description: Strict payload or reference validation failed
        '409':
          description: Author profile is missing or slug is already reserved by a current URL or alias
  /api/v1/creator/webinars/{webinarId}:
    get:
      summary: Read one Webinar through tenant and author scope
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: Webinar draft with legal metadata, sources and independent session summaries
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
    patch:
      summary: Update editable Webinar content and preserve a changed slug as an alias
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorWebinarDraft'
      responses:
        '200':
          description: Draft updated atomically and audited
        '400':
          description: Strict payload or reference validation failed
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
        '409':
          description: Webinar state is not editable or slug conflicts with a current URL or alias
  /api/v1/creator/webinars/{webinarId}/sessions:
    get:
      summary: List timezone-aware session instances for one scoped Webinar
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: Sessions with server-computed lifecycle state ordered by UTC start time
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
    post:
      summary: Create one bounded once, daily or weekly schedule and its independent session instances
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorWebinarScheduleCreate'
      responses:
        '201':
          description: Bounded recurrence created in the authenticated tenant and audited
        '400':
          description: Strict payload, timezone, date or DST wall-clock validation failed
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
        '409':
          description: Webinar is archived, already has a schedule or contains a colliding instance
  /api/v1/creator/sessions/{sessionId}:
    patch:
      summary: Reschedule or update an editable session with registered-participant safeguards
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorWebinarSessionUpdate'
      responses:
        '200':
          description: Session version incremented; stale reminders cancelled; service notices queued and audit written atomically
        '400':
          description: Strict payload, UTC timestamp or timezone validation failed
        '404':
          description: Unknown, unauthorized and cross-tenant sessions are intentionally indistinguishable
        '409':
          description: Registered change is unconfirmed, the session is no longer editable or time conflicts
    delete:
      summary: Cancel a session without deleting registrations or history
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorWebinarSessionCancel'
      responses:
        '200':
          description: Session marked cancelled; reminders revoked; service notices queued and audit written atomically
        '404':
          description: Unknown, unauthorized and cross-tenant sessions are intentionally indistinguishable
        '409':
          description: Registered cancellation is unconfirmed or the session is no longer editable
  /api/v1/creator/webinars/{webinarId}/sources:
    post:
      summary: Add one HTTPS legal source to an editable Webinar
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebinarSourceCreate'
      responses:
        '201':
          description: Tenant-scoped source created and audited
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
        '409':
          description: Webinar state is not editable
  /api/v1/creator/webinars/{webinarId}/sources/{sourceId}:
    delete:
      summary: Remove one source from an editable Webinar
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/WebinarSourceId'
      responses:
        '200':
          description: Source removed and mutation audited
        '404':
          description: Unknown, unauthorized and cross-tenant sources are intentionally indistinguishable
        '409':
          description: Webinar state is not editable
  /api/v1/creator/webinars/{webinarId}/preview:
    get:
      summary: Read a side-effect-free creator preview
      description: Does not create registrations, Leads, CRM events, email jobs or Telegram jobs.
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: Preview projection marked as non-production and side-effect free
        '404':
          description: Unknown, unauthorized and cross-tenant Webinars are intentionally indistinguishable
  /api/v1/creator/webinars/{webinarId}/submit:
    post:
      summary: Submit complete legal Webinar metadata to moderation
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Webinar moved from draft or needs-review to in-moderation exactly once
        '403':
          description: Author is not verified and active
        '409':
          description: Required metadata is missing or transition is invalid
  /api/v1/creator/webinars/{webinarId}/publish:
    post:
      summary: Publish a moderation-ready Webinar
      description: >-
        Author verification is checked before workflow readiness, so an unverified or suspended
        author receives 403 author_verification_required even when calling the API directly.
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ready Webinar published exactly once and audited
        '403':
          description: Author is not verified and active
        '409':
          description: Legal metadata, media, transcript, scenario or state is not publication-ready
  /api/v1/creator/webinars/{webinarId}/archive:
    post:
      summary: Archive a published Webinar without deleting sessions, registrations or analytics
      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published Webinar archived exactly once and audited
        '409':
          description: Webinar transition is invalid
  /api/v1/platform/author-verifications:
    get:
      summary: List author verification submissions for platform review
      security:
        - adminSessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, NEEDS_INFO, VERIFIED, REJECTED, SUSPENDED]
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 191
      responses:
        '200':
          description: Cursor page with private review metadata but no document bytes
        '403':
          description: Platform AdminUser role is insufficient
  /api/v1/platform/author-verifications/{verificationId}:
    get:
      summary: Read one platform author verification submission
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      responses:
        '200':
          description: Review details with public and internal comments
        '404':
          description: Verification does not exist
    patch:
      summary: Apply a role-limited author verification state transition
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorVerificationReview'
      responses:
        '200':
          description: State transition and internal/public comment handling audited atomically
        '400':
          description: Required reason or author-facing comment is missing
        '409':
          description: State transition is not allowed
  /api/v1/platform/author-verifications/evidence/{evidenceId}:
    get:
      summary: Download private verification evidence for platform review
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Audited private no-store attachment
        '403':
          description: Platform AdminUser role is insufficient
        '404':
          description: Evidence does not exist
  /api/registration/exchange/{token}:
    post:
      summary: Legacy one-time token exchange (deprecated)
      deprecated: true
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session cookie issued
        '403':
          description: CSRF token is missing or invalid
        '404':
          description: Token is expired or already used
  /api/registration/session/current:
    get:
      summary: Current registration/session state from cookie
      responses:
        '200':
          description: Current cookie-backed room state
  /api/webinar/current:
    get:
      summary: Public webinar schedule state
      responses:
        '200':
          description: Webinar schedule and countdown
  /api/webinar/timeline/session/current:
    get:
      summary: Cookie-backed webinar timeline
      responses:
        '200':
          description: Timeline and live state
        '401':
          description: Missing room cookie
  /api/webinar/chat/session/current:
    get:
      summary: Cookie-backed webinar chat
      responses:
        '200':
          description: Chat messages and live state
  /api/questions:
    post:
      summary: Submit webinar question
      responses:
        '201':
          description: Question accepted
        '403':
          description: CSRF token is missing or invalid
  /api/partner-application:
    post:
      summary: Submit partner application
      responses:
        '201':
          description: Application accepted
        '403':
          description: CSRF token is missing or invalid
  /api/admin/login:
    post:
      summary: Admin login
      responses:
        '200':
          description: Admin session cookie issued
  /api/admin/telegram/broadcast:
    post:
      summary: Queue durable Telegram broadcast
      responses:
        '202':
          description: Broadcast job queued
components:
  parameters:
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    AuthorSlug:
      name: authorSlug
      in: path
      required: true
      schema:
        type: string
        pattern: '^author-[0-9a-f]{24}$'
    WebinarId:
      name: webinarId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    WebinarSourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    WebinarSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 191
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    OneTimeTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    PasswordlessLoginRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ActiveOrganizationRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          minLength: 1
          maxLength: 191
    MembershipRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [OWNER, AUTHOR, MODERATOR, CRM_MANAGER, ANALYST, AUDITOR]
    OrganizationInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          enum: [OWNER, AUTHOR, MODERATOR, CRM_MANAGER, ANALYST, AUDITOR]
    MfaOtpRequest:
      type: object
      additionalProperties: false
      required: [otp]
      properties:
        otp:
          type: string
          pattern: '^\d{6}$'
    AuthorProfileDraft:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        publicName:
          type: string
          nullable: true
          minLength: 2
          maxLength: 160
        bio:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
        specializations:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 120
        professionalOrganization:
          type: string
          nullable: true
          minLength: 2
          maxLength: 240
        region:
          type: string
          nullable: true
          minLength: 2
          maxLength: 160
        experience:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
    AuthorVerificationReview:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [NEEDS_INFO, VERIFIED, REJECTED, SUSPENDED]
        publicComment:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        internalReason:
          type: string
          nullable: true
          minLength: 1
          maxLength: 4000
    CreatorWebinarCreate:
      allOf:
        - $ref: '#/components/schemas/CreatorWebinarDraft'
        - type: object
          required: [title, slug]
    CreatorWebinarDraft:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 240
        slug:
          type: string
          minLength: 3
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description:
          type: string
          nullable: true
          minLength: 20
          maxLength: 10000
        outcomeDescription:
          type: string
          nullable: true
          minLength: 10
          maxLength: 2000
        jurisdictionId:
          type: string
          nullable: true
          maxLength: 191
        practiceAreas:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [practiceAreaId, isPrimary]
            properties:
              practiceAreaId:
                type: string
                maxLength: 191
              isPrimary:
                type: boolean
        visibility:
          type: string
          enum: [PUBLIC, UNLISTED, PRIVATE]
        freshnessStatus:
          type: string
          enum: [CURRENT, REVIEW_DUE, OUTDATED, SUPERSEDED, UNKNOWN]
        audienceLevel:
          type: string
          nullable: true
          enum: [INTRODUCTORY, PRACTITIONER, ADVANCED, ALL_LEVELS]
        targetAudience:
          type: string
          nullable: true
          maxLength: 1000
        format:
          type: string
          nullable: true
          enum: [RECORDED, PREMIERE, ON_DEMAND]
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 180
        language:
          type: string
          minLength: 2
          maxLength: 20
        currentAsOf:
          type: string
          format: date
          nullable: true
        disclaimer:
          type: string
          nullable: true
          minLength: 20
          maxLength: 2000
        syntheticDisclosure:
          type: string
          nullable: true
          minLength: 10
          maxLength: 2000
        supersededByWebinarId:
          type: string
          nullable: true
          maxLength: 191
    WebinarSourceCreate:
      type: object
      additionalProperties: false
      required: [type, title, url]
      properties:
        type:
          type: string
          enum:
            [
              REGULATION,
              STATUTE_PROVISION,
              COURT_DECISION,
              OFFICIAL_GUIDANCE,
              OFFICIAL_SOURCE,
              TEMPLATE_OR_CHECKLIST,
              OTHER,
            ]
        title:
          type: string
          minLength: 2
          maxLength: 500
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
        accessedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 4000
        orderIndex:
          type: integer
          minimum: 0
          maximum: 10000
    CreatorWebinarScheduleCreate:
      type: object
      additionalProperties: false
      required: [recurrenceType, timezone, localStartTime, startsOn, durationMinutes]
      properties:
        recurrenceType:
          type: string
          enum: [ONCE, DAILY, WEEKLY]
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          example: Europe/Amsterdam
        localStartTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:00'
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
          nullable: true
        maxFutureInstances:
          type: integer
          minimum: 1
          maximum: 90
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
        roomOpenBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 180
        replayAvailableHours:
          type: integer
          minimum: 0
          maximum: 8760
        replayEnabled:
          type: boolean
    CreatorWebinarSessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scheduledAt:
          type: string
          format: date-time
          description: Explicit UTC or offset-bearing timestamp; the server persists UTC.
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
        roomOpenBeforeMinutes:
          type: integer
          minimum: 0
          maximum: 180
        replayAvailableHours:
          type: integer
          minimum: 0
          maximum: 8760
        replayEnabled:
          type: boolean
        confirmRegisteredChange:
          type: boolean
        reason:
          type: string
          minLength: 10
          maxLength: 2000
    CreatorWebinarSessionCancel:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        confirmRegisteredChange:
          type: boolean
        reason:
          type: string
          minLength: 10
          maxLength: 2000
  securitySchemes:
    metricsBearer:
      type: http
      scheme: bearer
    userSessionCookie:
      type: apiKey
      in: cookie
      name: aspb_user_session
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: aspb_admin_session
