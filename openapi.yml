        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: UTC aggregates with counts below three suppressed }
        '401': { description: MFA AdminUser session missing; tenant sessions are not accepted }
        '403': { description: AdminUser role is not owner/admin }
