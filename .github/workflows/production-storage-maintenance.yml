name: Production storage maintenance

on:
  push:
    branches:
      - codex/storage-maintenance
      - main
    paths:
      - .github/workflows/production-storage-maintenance.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only or apply allowlisted retention
        required: true
        type: choice
        default: inventory
        options:
          - inventory
          - apply
          - remove-stale-7d9111b
          - delete-short-recording
      install_retention:
        description: Install a 15-minute retention cron for the production deploy user
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-storage-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_INSTALL_RETENTION: ${{ inputs.install_retention }}
    steps:
      - name: Validate maintenance configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_SSH_KEY PRODUCTION_DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing production setting::$name is unavailable to the maintenance job"
              echo "Missing production maintenance setting: $name" >&2
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Inventory, apply targeted retention, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mode=inventory
          install_retention=off
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-inventory}"
            if [[ "${INPUT_INSTALL_RETENTION:-false}" == "true" ]]; then
              install_retention=on
            else
              install_retention=off
            fi
          fi
          if [[ "$mode" != "inventory" && "$mode" != "apply" && "$mode" != "remove-stale-7d9111b" && "$mode" != "delete-short-recording" ]]; then
            echo "Unsupported maintenance mode: $mode" >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          key_file=~/.ssh/production_storage_maintenance_key
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          cleanup_key() {
            rm -f -- "$key_file"
          }
          trap cleanup_key EXIT

          printf -v deploy_path_q '%q' "$PRODUCTION_DEPLOY_PATH"
          printf -v mode_q '%q' "$mode"
          printf -v install_retention_q '%q' "$install_retention"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$key_file" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "bash -s -- $deploy_path_q $mode_q $install_retention_q" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          mode="$2"
          install_retention="$3"
          if [[ "$deploy_path" != /* || ! -d "$deploy_path" ]]; then
            echo "Production deploy path is invalid or missing." >&2
            exit 1
          fi
          if [[ "$mode" != "inventory" && "$mode" != "apply" && "$mode" != "remove-stale-7d9111b" && "$mode" != "delete-short-recording" ]]; then
            echo "Unsupported maintenance mode: $mode" >&2
            exit 1
          fi
          if [[ "$install_retention" != "on" && "$install_retention" != "off" ]]; then
            echo "Unsupported retention installation mode: $install_retention" >&2
            exit 1
          fi
          cd "$deploy_path"

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          disk_inventory() {
            section "Filesystem"
            df -hT /
            df -ih /

            section "Largest top-level paths"
            if command -v timeout >/dev/null 2>&1; then
              timeout 180 du -xhd1 /var /opt /tmp 2>/dev/null | sort -h || true
            else
              du -xhd1 /var /opt /tmp 2>/dev/null | sort -h || true
            fi

            section "Docker usage"
            docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
            docker system df -v || true
            docker builder du || true

            section "Containers"
            docker ps -a --size --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Size}}' || true

            section "Known retention targets"
            du -sh backups /opt/compliance152-releases 2>/dev/null || true
            find /tmp -mindepth 1 -maxdepth 1 -type d -name 'aspb-deploy-*' -mtime +0 -print 2>/dev/null || true

            section "System logs and deleted-open files"
            journalctl --disk-usage 2>/dev/null || true
            if command -v lsof >/dev/null 2>&1; then
              lsof +L1 2>/dev/null | head -n 100 || true
            fi
          }

          disk_inventory

          section "ASPB image retention dry-run"
          APP_IMAGE_KEEP_RECENT=3 bash scripts/prune-app-images.sh --dry-run

          compliance_ready=false
          if [[ -f /opt/compliance152-releases/.compliance152-release-root && -L /opt/compliance152-current ]]; then
            compliance_ready=true
            section "Compliance release retention dry-run"
            COMPLIANCE_PRUNE_LOCK_FILE=/tmp/prune-compliance152-releases.lock \
              COMPLIANCE_KEEP_RELEASES=5 \
              bash scripts/prune-server-storage.sh --dry-run
          else
            section "Compliance release retention"
            echo "Guard marker or active-release symlink is absent; compliance cleanup is skipped."
          fi

          if [[ "$mode" == "apply" ]]; then
            section "Applying allowlisted ASPB image retention"
            APP_IMAGE_KEEP_RECENT=3 bash scripts/prune-app-images.sh --apply

            if [[ "$compliance_ready" == "true" ]]; then
              section "Applying guarded compliance release retention"
              COMPLIANCE_PRUNE_LOCK_FILE=/tmp/prune-compliance152-releases.lock \
                COMPLIANCE_KEEP_RELEASES=5 \
                bash scripts/prune-server-storage.sh --apply
            fi
          fi

          if [[ "$mode" == "remove-stale-7d9111b" ]]; then
            section "Removing approved stale ASPB image 7d9111b"
            target_id=sha256:5b50f8f0a4601f79d4f91347836a382a6eb75001e29299c0b4374d80f46268d3
            target_revision=7d9111b51f1c6ef663a4a6a444395edaf2f38ab2
            api_tag="aspb-autowebinar-api:$target_revision"
            worker_tag="aspb-autowebinar-worker:$target_revision"
            expected_tags="$(printf '%s\n' \
              "$api_tag" \
              "$worker_tag")"

            if ! docker image inspect "$target_id" >/dev/null 2>&1; then
              echo "Approved stale image is already absent; nothing to remove."
            else
              actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$target_id")"
              if [[ "$actual_revision" != "$target_revision" ]]; then
                echo "Refusing removal: image revision label does not match the approved commit." >&2
                exit 1
              fi

              attached_containers="$(docker ps -aq --filter "ancestor=$target_id")"
              if [[ -n "$attached_containers" ]]; then
                echo "Refusing removal: approved stale image is referenced by container(s): $attached_containers" >&2
                exit 1
              fi

              actual_tags="$(docker image inspect --format '{{range .RepoTags}}{{println .}}{{end}}' "$target_id" | sed '/^$/d' | sort)"
              if [[ "$actual_tags" != "$expected_tags" ]]; then
                echo "Refusing removal: image tags differ from the two approved ASPB tags." >&2
                printf 'Actual tags:\n%s\n' "$actual_tags" >&2
                exit 1
              fi

              docker image rm "$api_tag" "$worker_tag"
              if docker image inspect "$target_id" >/dev/null 2>&1; then
                echo "Approved stale image still exists after removal." >&2
                exit 1
              fi
              echo "Removed only the approved unused image $target_id ($target_revision)."
            fi
          fi

          if [[ "$mode" == "delete-short-recording" ]]; then
            section "Deleting the approved 9:28 production recording"
            live_api_pid=""
            for env_file in /proc/[0-9]*/environ; do
              [[ -r "$env_file" ]] || continue
              process_environment="$(tr '\0' '\n' < "$env_file" 2>/dev/null || true)"
              public_site_url="$(printf '%s\n' "$process_environment" | sed -n 's/^PUBLIC_SITE_URL=//p' | tail -n 1)"
              worker_role="$(printf '%s\n' "$process_environment" | sed -n 's/^WORKER_ROLE=//p' | tail -n 1)"
              if [[ "$public_site_url" == "https://aspb-partners.ru" && "$worker_role" == "api" ]]; then
                live_api_pid="${env_file#/proc/}"
                live_api_pid="${live_api_pid%/environ}"
                break
              fi
            done
            if [[ -z "$live_api_pid" ]]; then
              echo "Relevant reverse-proxy routes:" >&2
              if command -v nginx >/dev/null 2>&1; then
                nginx -T 2>/dev/null | grep -nE 'aspb-partners\.ru|proxy_pass|5174|5175|5176' >&2 || true
              fi
              echo "Listening application ports:" >&2
              ss -ltnp 2>/dev/null | grep -E ':(5174|5175|5176|3000|8080)[[:space:]]' >&2 || true
              echo "Node application processes:" >&2
              ps -eo pid,user,args | grep -E '[n]ode|[n]pm' >&2 || true
              echo "ASPB systemd units:" >&2
              systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -iE 'aspb|webinar' >&2 || true
              echo "Could not locate the running aspb-partners.ru API process." >&2
              exit 1
            fi

            live_database_url="$(tr '\0' '\n' < "/proc/$live_api_pid/environ" | sed -n 's/^DATABASE_URL=//p' | tail -n 1)"
            live_cwd="$(readlink -e "/proc/$live_api_pid/cwd")"
            live_node="$(readlink -e "/proc/$live_api_pid/exe")"
            if [[ "$live_database_url" != postgresql://* && "$live_database_url" != postgres://* ]]; then
              echo "The live API process has no supported DATABASE_URL." >&2
              exit 1
            fi
            if [[ ! -d "$live_cwd/node_modules/@prisma/client" || ! -x "$live_node" ]]; then
              echo "The live API runtime cannot execute the guarded Prisma deletion." >&2
              exit 1
            fi

            cd "$live_cwd"
            DATABASE_URL="$live_database_url" "$live_node" - <<'NODE'
          const { PrismaClient } = require('@prisma/client');

          const prisma = new PrismaClient();
          const targetId = 'cmq8bky18000eo3218badqb83';
          const targetTitle = 'Экономика кризиса: как бухгалтеру и юристу развиваться в условиях нестабильности';

          (async () => {
            const recording = await prisma.webinarRecording.findUnique({
              where: { id: targetId },
              select: { id: true, title: true, visible: true, durationSeconds: true },
            });
            if (recording && recording.title !== targetTitle) {
              throw new Error('Refusing guarded deletion: the recording id has an unexpected title');
            }
            const deleted = recording
              ? await prisma.webinarRecording.deleteMany({ where: { id: targetId, title: targetTitle } })
              : { count: 0 };
            const remaining = await prisma.webinarRecording.count({ where: { id: targetId } });
            console.log(JSON.stringify({ matchedBefore: recording ? 1 : 0, deleted: deleted.count, remaining }));
            if (remaining !== 0) process.exitCode = 1;
          })().catch(error => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          }).finally(async () => {
            await prisma.$disconnect();
          });
          NODE
            echo "Verified through the live aspb-partners.ru API database: the approved recording id is absent."
          fi

          if [[ "$mode" == "apply" && "$install_retention" == "on" ]]; then
            section "Installing 15-minute retention schedule"
            if command -v crontab >/dev/null 2>&1; then
              cron_tmp="$(mktemp)"
              cleanup_cron_tmp() {
                rm -f -- "$cron_tmp"
              }
              trap cleanup_cron_tmp EXIT
              crontab -l 2>/dev/null | grep -v 'ASPB_STORAGE_RETENTION_V1' > "$cron_tmp" || true
              printf -v deploy_path_q '%q' "$deploy_path"
              logger_path="$(command -v logger || true)"
              if [[ -z "$logger_path" ]]; then
                logger_path=/usr/bin/logger
              fi
              printf -v logger_path_q '%q' "$logger_path"
              printf '%s\n' \
                "*/15 * * * * /bin/bash -lc 'cd $deploy_path_q || exit 1; APP_IMAGE_KEEP_RECENT=3 bash scripts/prune-app-images.sh --apply; if [ -f /opt/compliance152-releases/.compliance152-release-root ] && [ -L /opt/compliance152-current ]; then COMPLIANCE_PRUNE_LOCK_FILE=/tmp/prune-compliance152-releases.lock COMPLIANCE_KEEP_RELEASES=5 bash scripts/prune-server-storage.sh --apply; fi' 2>&1 | $logger_path_q -t aspb-storage-retention # ASPB_STORAGE_RETENTION_V1" \
                >> "$cron_tmp"
              crontab "$cron_tmp"
              cleanup_cron_tmp
              trap - EXIT
              if crontab -l | grep -q 'ASPB_STORAGE_RETENTION_V1'; then
                echo "Retention schedule installed for the production deploy user."
              else
                echo "Retention schedule verification failed." >&2
                exit 1
              fi
              if command -v systemctl >/dev/null 2>&1; then
                systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || true
              fi
            else
              echo "crontab is unavailable; no recurring schedule was installed." >&2
              exit 1
            fi
          fi

          section "Post-maintenance verification"
          df -hT /
          df -ih /
          docker system df -v || true
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

          for container_name in aspb-autowebinar-api aspb-autowebinar-worker; do
            if docker inspect "$container_name" >/dev/null 2>&1; then
              docker inspect --format '{{.Name}} status={{.State.Status}}{{if .State.Health}} health={{.State.Health.Status}}{{end}}' "$container_name"
            fi
          done
          REMOTE
