            application/json:
              schema: { $ref: '#/components/schemas/CreatorWizardReadinessResponse' }
        '404': { description: Unknown, cross-tenant, unauthorized or rollout-disabled Webinar }
  /api/v1/creator/webinars/{webinarId}/chapters:
