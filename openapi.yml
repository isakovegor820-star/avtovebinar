  /api/events:
    post:
      summary: Record one versioned, privacy-safe analytics event
      description: >-
        schemaVersion 1 is the current contract. Tenant scope is resolved from the participant cookie and
        verified Organization -> Webinar -> WebinarSession -> registration/User relations; supplied entity IDs
        are hints only and unknown/foreign hints return the same safe 404. occurredAt is always assigned by the
        database in UTC. clientOccurredAt is optional diagnostic data and never replaces server time. Browser and
        server writers namespace dedupKey by event name; it is unique inside the server-derived organization, or
        inside the explicit platform scope, regardless of event type. Reuse with another type or payload returns
        409. Unversioned legacy payloads remain temporarily
        accepted as schemaVersion 0 through a logged compatibility adapter. Request size is limited to 12 KiB.
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          description: Safe retry correlation identifier; invalid values are ignored and replaced by a server-generated ID.
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AnalyticsEventV1'
                - $ref: '#/components/schemas/LegacyAnalyticsEvent'
      responses:
        '200':
          description: Idempotent replay accepted without creating another event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsEventAccepted' }
        '201':
          description: One event created, or a legacy compatibility event accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsEventAccepted' }
        '400':
          description: Strict schema, version, taxonomy, source, correlation, key, client time or attributes validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEventError' } } }
        '404':
          description: Unknown and cross-tenant scope hints are intentionally indistinguishable
          content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEventError' } } }
        '409':
          description: The dedup key already belongs to another event type or payload in this scope
          content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEventError' } } }
        '413':
          description: Analytics request exceeds 12 KiB
          content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEventError' } } }
        '429':
          description: Analytics rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEventError' } } }
