services:
  postgres:
    image: postgres:16-alpine
    container_name: aspb-autowebinar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aspb
      POSTGRES_DB: aspb_autowebinar
      # Пароль вместо trust-auth: даже на dev-машине БД не должна быть открыта
      # любому локальному процессу без пароля. Логин/пароль для DATABASE_URL — см. .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aspb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspb -d aspb_autowebinar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aspb_postgres_data:
