name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy the verified workflow commit after all required jobs pass
        required: true
        type: choice
        default: none
        options:
          - none
          - staging-inventory
          - staging-provision
          - staging
          - production
      confirm_staging_provision:
        description: Confirm the reviewed isolated STAGING database, port 5176, Nginx and TLS provisioning action
        required: true
        type: boolean
        default: false
      allow_first_deploy:
        description: Allow the selected staging/production target to start without an existing rollback image
        required: true
        type: boolean
        default: false

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Secretlint
        run: git ls-files -z | xargs -0 npx --yes -p secretlint@13.0.4 -p @secretlint/secretlint-rule-preset-recommend@13.0.4 secretlint --secretlintrc .secretlintrc.json

      - name: Dotenv lint
        run: npx --yes dotenv-linter@0.2.0 .env.example .env.production.example

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aspb
          POSTGRES_DB: aspb_autowebinar
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aspb -d aspb_autowebinar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5174
      PUBLIC_SITE_URL: http://127.0.0.1:5174
      DATABASE_URL: postgresql://aspb@localhost:5432/aspb_autowebinar?schema=test
      ADMIN_LOGIN: admin@example.com
      ADMIN_PASSWORD: StrongAdmin123
      ADMIN_COOKIE_SECRET: ci-admin-cookie-secret-32-plus-chars
      IP_HASH_SECRET: ci-ip-hash-secret-32-plus-chars-x
      EMAIL_MODE: log
      EMAIL_FROM: 'АСПБ <no-reply@example.com>'
      TELEGRAM_GROUP_URL: https://t.me/example
      TELEGRAM_NOTIFY_MODE: log
      TELEGRAM_ADMIN_BOT_POLLING: off
      TELEGRAM_BOT_POLLING: off
      TELEGRAM_PARTICIPANT_BOT_POLLING: off
      TELEGRAM_NEWS_BROADCAST: off
      TELEGRAM_NEWS_TIMES: 09:00,11:30,14:00,16:30,19:00
      TELEGRAM_NEWS_RSS_URLS: https://www.consultant.ru/rss/hotdocs.xml,https://www.consultant.ru/rss/nw.xml,https://www.consultant.ru/rss/db.xml
      WEBINAR_TEST_ROOM_MODE: off
      CORS_ORIGIN: http://127.0.0.1:5174
      WORKER_ROLE: all

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css:build

      - name: Format and validate Prisma schema
        run: |
          npx prisma format
          git diff --exit-code -- prisma/schema.prisma
          npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed staging-compatible data
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Production command smoke test
        run: test -f dist/src/server.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aspb
          POSTGRES_DB: aspb_autowebinar
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aspb -d aspb_autowebinar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aspb@localhost:5432/aspb_autowebinar?schema=test
      ADMIN_LOGIN: admin@example.com
      ADMIN_PASSWORD: StrongAdmin123
      ADMIN_COOKIE_SECRET: ci-admin-cookie-secret-32-plus-chars
      IP_HASH_SECRET: ci-ip-hash-secret-32-plus-chars-x
      EMAIL_MODE: log
      EMAIL_FROM: 'АСПБ <no-reply@example.com>'
      TELEGRAM_GROUP_URL: https://t.me/example
      TELEGRAM_NOTIFY_MODE: log
      TELEGRAM_ADMIN_BOT_POLLING: off
      TELEGRAM_BOT_POLLING: off
      TELEGRAM_PARTICIPANT_BOT_POLLING: off
      TELEGRAM_NEWS_BROADCAST: off
      TELEGRAM_NEWS_TIMES: 09:00,11:30,14:00,16:30,19:00
      TELEGRAM_NEWS_RSS_URLS: https://www.consultant.ru/rss/hotdocs.xml,https://www.consultant.ru/rss/nw.xml,https://www.consultant.ru/rss/db.xml
      WEBINAR_TEST_ROOM_MODE: off
      CORS_ORIGIN: http://127.0.0.1:5175
      WORKER_ROLE: api

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser e2e
        run: npm run e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit

  iac-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infra/yandex/staging
        run: terraform fmt -check -recursive

      - name: Terraform validate without backend or apply
        working-directory: infra/yandex/staging
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate immutable deploy contract
        run: node scripts/assert-ci-deploy-contract.mjs

      - name: Docker build smoke test
        run: |
          build_ref="aspb-autowebinar-build:$GITHUB_SHA"
          artifact="/tmp/aspb-image-$GITHUB_SHA.tar"
          diff_probe=crisis_premium/_diffs_ci_context_probe.txt
          full_diff_probe=crisis_premium/_full_diffs_ci_context_probe.txt
          cleanup() { rm -f -- "$diff_probe" "$full_diff_probe"; }
          trap cleanup EXIT
          touch "$diff_probe" "$full_diff_probe"
          docker build --build-arg BUILD_COMMIT_SHA="$GITHUB_SHA" -t "$build_ref" .
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$build_ref")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "com.aspb.schema.compatibility"}}' "$build_ref")" = "email-links-v2"
          docker run --rm --entrypoint sh "$build_ref" -c \
            'test ! -e /app/crisis_premium/_diffs_ci_context_probe.txt && test ! -e /app/crisis_premium/_full_diffs_ci_context_probe.txt && test "$APP_BUILD_COMMIT_SHA" = "'"$GITHUB_SHA"'"'
          docker save -o "$artifact" "$build_ref"
          gzip -9 "$artifact"
          cd /tmp
          sha256sum "aspb-image-$GITHUB_SHA.tar.gz" > "aspb-image-$GITHUB_SHA.tar.gz.sha256"
          cd "$GITHUB_WORKSPACE"
          cleanup
          trap - EXIT

      - name: Attest immutable deploy image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/aspb-image-${{ github.sha }}.tar.gz

      - name: Upload immutable deploy image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aspb-image-${{ github.sha }}
          path: |
            /tmp/aspb-image-${{ github.sha }}.tar.gz
            /tmp/aspb-image-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Targeted image retention dry run
        run: APP_IMAGE_KEEP_RECENT=3 bash scripts/prune-app-images.sh --dry-run

      - name: Validate tracked production compose files
        env:
          COMPOSE_ENV_FILE: .env.production.example
          DEPLOY_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: |
          docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.native-postgres.yml config --quiet

      - name: Reject untracked deploy source files
        run: |
          fixture_dir=prisma/migrations/__ci_untracked_deploy_gate__
          gate_log=/tmp/aspb-clean-worktree-gate.log
          cleanup() { rm -rf -- "$fixture_dir"; rm -f -- "$gate_log"; }
          trap cleanup EXIT
          mkdir -p "$fixture_dir"
          touch "$fixture_dir/migration.sql"
          if bash scripts/assert-clean-deploy-worktree.sh >"$gate_log" 2>&1; then
            echo "Deploy worktree gate accepted an untracked migration" >&2
            exit 1
          fi
          grep -q '__ci_untracked_deploy_gate__/migration.sql' "$gate_log"
          cleanup
          trap - EXIT
          bash scripts/assert-clean-deploy-worktree.sh

      - name: Require private production env permissions
        run: |
          env_fixture="$(mktemp)"
          cleanup() { rm -f -- "$env_fixture"; }
          trap cleanup EXIT
          chmod 600 "$env_fixture"
          bash scripts/assert-private-env-file.sh "$env_fixture"
          chmod 644 "$env_fixture"
          if bash scripts/assert-private-env-file.sh "$env_fixture"; then
            echo "Production env permission gate accepted mode 0644" >&2
            exit 1
          fi

      - name: Docker production command smoke test
        run: docker run --rm --entrypoint sh "aspb-autowebinar-build:$GITHUB_SHA" -c 'test -f dist/src/server.js'

      - name: Real media acceptance in production image
        run: docker run --rm --entrypoint sh -e NODE_ENV=test "aspb-autowebinar-build:$GITHUB_SHA" -c 'node dist/src/cli/mediaAcceptance.js'

      - name: Persistent media restart acceptance
        run: |
          volume_name="aspb-media-acceptance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { docker volume rm -f "$volume_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$volume_name"
          for phase in upload resume; do
            docker run --rm \
              --entrypoint node \
              -e NODE_ENV=test \
              -e MEDIA_STORAGE_PROVIDER=local_fs \
              -e MEDIA_LOCAL_ROOT=/var/lib/aspb/media \
              -e MEDIA_ACCEPTANCE_RESTART=on \
              -v "$volume_name:/var/lib/aspb/media" \
              "aspb-autowebinar-build:$GITHUB_SHA" \
              dist/src/cli/mediaAcceptance.js "--restart-$phase"
          done
          cleanup
          trap - EXIT

      - name: Deploy safety regression checks
        run: |
          bash scripts/test-deploy-release-safety.sh
          bash scripts/test-install-deploy-image-attestation.sh
          bash scripts/test-infra-safety.sh

  staging-inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging-inventory'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-inventory
      cancel-in-progress: false
    steps:
      - name: Inspect staging isolation prerequisites without mutations
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          if [ -z "$STAGING_SSH_HOST" ] || [ -z "$STAGING_SSH_USER" ] || [ -z "$STAGING_SSH_KEY" ] || [ -z "$STAGING_DEPLOY_PATH" ]; then
            echo "Staging inventory configuration is incomplete." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_inventory_key
          chmod 600 ~/.ssh/staging_inventory_key
          printf -v deploy_path_q '%q' "$STAGING_DEPLOY_PATH"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_inventory_key \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $deploy_path_q" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          if [[ "$deploy_path" != /* || ! -d "$deploy_path" ]]; then
            echo "staging_deploy_path_valid=false"
            exit 1
          fi
          env_file="$deploy_path/.env.production"
          if [[ ! -f "$env_file" || -L "$env_file" ]]; then
            echo "staging_env_file_valid=false"
            exit 1
          fi
          read_env_value() {
            local name="$1" value
            value="$(sed -n "s/^${name}=//p" "$env_file" | tail -n 1)"
            value="${value%$'\r'}"
            case "$value" in
              \"*\") value="${value:1:${#value}-2}" ;;
              \'*\') value="${value:1:${#value}-2}" ;;
            esac
            printf '%s' "$value"
          }
          public_site_url="$(read_env_value PUBLIC_SITE_URL)"
          runtime_host="${public_site_url#*://}"
          runtime_host="${runtime_host%%/*}"
          runtime_host="${runtime_host%%:*}"
          database_url="$(read_env_value DATABASE_URL)"
          database_target="${database_url%%\?*}"
          database_name="${database_target##*/}"
          app_port="$(read_env_value PORT)"
          [[ "$app_port" =~ ^[0-9]+$ ]] || app_port=invalid
          if [[ "${runtime_host,,}" == *staging* ]]; then
            runtime_marker=true
          else
            runtime_marker=false
          fi
          if [[ "${database_name,,}" == *staging* || "${database_name,,}" == *test* ]]; then
            database_marker=true
          else
            database_marker=false
          fi
          if command -v ss >/dev/null 2>&1 && ss -ltnH 'sport = :5176' 2>/dev/null | grep -q .; then
            candidate_port_5176_free=false
          else
            candidate_port_5176_free=true
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            passwordless_sudo=true
          else
            passwordless_sudo=false
          fi
          printf 'staging_deploy_path_valid=true\n'
          printf 'staging_env_file_valid=true\n'
          printf 'runtime_origin_host=%s\n' "${runtime_host:-missing}"
          printf 'runtime_origin_has_staging_marker=%s\n' "$runtime_marker"
          printf 'database_target_has_staging_marker=%s\n' "$database_marker"
          printf 'configured_container_port=%s\n' "$app_port"
          printf 'candidate_host_port_5176_free=%s\n' "$candidate_port_5176_free"
          printf 'docker_available=%s\n' "$(command -v docker >/dev/null 2>&1 && echo true || echo false)"
          printf 'nginx_available=%s\n' "$(command -v nginx >/dev/null 2>&1 && echo true || echo false)"
          printf 'certbot_available=%s\n' "$(command -v certbot >/dev/null 2>&1 && echo true || echo false)"
          printf 'passwordless_sudo=%s\n' "$passwordless_sudo"
          printf 'matching_containers:\n'
          docker ps -a --format '{{.Names}} status={{.Status}} ports={{.Ports}}' 2>/dev/null | grep -E '(^|[-_])(aspb|autowebinar)([-_]|$)' || true
          REMOTE

  provision-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_target == 'staging-provision' &&
      inputs.confirm_staging_provision
    runs-on: ubuntu-latest
    needs: [sast, secret-scan, verify, e2e, dependency-audit, iac-validate, container-build]
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout reviewed provisioning code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate provisioning configuration
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          if [ -z "$STAGING_SSH_HOST" ] || [ -z "$STAGING_SSH_USER" ] || [ -z "$STAGING_SSH_KEY" ] || [ -z "$STAGING_DEPLOY_PATH" ]; then
            echo "STAGING provisioning configuration is incomplete." >&2
            exit 1
          fi
          test -x scripts/provision-staging-host.sh

      - name: Provision isolated STAGING database, Nginx and TLS
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_provision_key
          chmod 600 ~/.ssh/staging_provision_key
          remote_script="/tmp/aspb-staging-provision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          printf -v remote_script_q '%q' "$remote_script"
          printf -v deploy_path_q '%q' "$STAGING_DEPLOY_PATH"
          cleanup_remote_script() {
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_provision_key \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" "rm -f -- $remote_script_q" >/dev/null 2>&1 || true
          }
          trap cleanup_remote_script EXIT
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_provision_key \
            scripts/provision-staging-host.sh \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$remote_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_provision_key \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "chmod 700 -- $remote_script_q && bash $remote_script_q $deploy_path_q staging.72-56-38-62.sslip.io 5176 aspb-platform-staging aspb-platform-staging-postgres"
          cleanup_remote_script
          trap - EXIT

  deploy-staging:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production'))
    runs-on: ubuntu-latest
    needs: [sast, secret-scan, verify, e2e, dependency-audit, iac-validate, container-build]
    environment: staging
    outputs:
      public_url: ${{ steps.staging-origin.outputs.public_url }}
      allowed_host: ${{ steps.staging-origin.outputs.allowed_host }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Download verified deploy image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aspb-image-${{ github.sha }}
          path: .deploy-artifact

      - name: Check staging configuration
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_NATIVE_POSTGRES_STORAGE_PATH: ${{ secrets.STAGING_NATIVE_POSTGRES_STORAGE_PATH }}
        run: |
          if [ -z "$STAGING_SSH_HOST" ] || [ -z "$STAGING_SSH_USER" ] || [ -z "$STAGING_SSH_KEY" ] || [ -z "$STAGING_DEPLOY_PATH" ] || [ -z "$STAGING_NATIVE_POSTGRES_STORAGE_PATH" ]; then
            echo "Staging deploy configuration is incomplete; all STAGING_* secrets are required." >&2
            exit 1
          fi

      - name: Resolve and validate staging runtime origin
        id: staging-origin
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          printf -v deploy_path_q '%q' "$STAGING_DEPLOY_PATH"
          origin_record="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_key \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $deploy_path_q" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          if [[ "$deploy_path" != /* || ! -d "$deploy_path" ]]; then
            echo "Invalid staging deploy path" >&2
            exit 1
          fi
          env_file="$deploy_path/.env.production"
          if [[ ! -f "$env_file" || -L "$env_file" ]]; then
            echo "Staging .env.production must be a regular non-symlink file" >&2
            exit 1
          fi
          public_site_url="$(sed -n 's/^PUBLIC_SITE_URL=//p' "$env_file" | tail -n 1)"
          public_site_url="${public_site_url%$'\r'}"
          case "$public_site_url" in
            \"*\") public_site_url="${public_site_url:1:${#public_site_url}-2}" ;;
            \'*\') public_site_url="${public_site_url:1:${#public_site_url}-2}" ;;
          esac
          if [[ ! "$public_site_url" =~ ^https://([A-Za-z0-9-]+\.)*[A-Za-z0-9-]+(:[0-9]+)?/?$ ]]; then
            echo "Staging PUBLIC_SITE_URL must be an HTTPS origin without credentials, query, fragment, or path" >&2
            exit 1
          fi
          authority="${public_site_url#https://}"
          authority="${authority%/}"
          allowed_host="${authority%%:*}"
          if [[ "${allowed_host,,}" != *staging* ]]; then
            echo "Rejected staging PUBLIC_SITE_URL host: $allowed_host" >&2
            echo "Staging PUBLIC_SITE_URL host must contain the staging safety marker" >&2
            exit 1
          fi
          printf '%s\t%s\n' "$public_site_url" "$allowed_host"
          REMOTE
          )"
          IFS=$'\t' read -r public_site_url allowed_host <<< "$origin_record"
          if [ -z "$public_site_url" ] || [ -z "$allowed_host" ]; then
            echo "Could not resolve the staging runtime origin" >&2
            exit 1
          fi
          echo "Staging runtime origin: $public_site_url"
          echo "public_url=$public_site_url" >> "$GITHUB_OUTPUT"
          echo "allowed_host=$allowed_host" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging over SSH
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_NATIVE_POSTGRES_STORAGE_PATH: ${{ secrets.STAGING_NATIVE_POSTGRES_STORAGE_PATH }}
          STAGING_MIN_DEPLOY_FREE_PERCENT: ${{ vars.STAGING_MIN_DEPLOY_FREE_PERCENT || '5' }}
          ALLOW_FIRST_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_first_deploy && 'on' || 'off' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          printf -v deploy_path_q '%q' "$STAGING_DEPLOY_PATH"
          printf -v deploy_sha_q '%q' "$GITHUB_SHA"
          printf -v ci_run_url_q '%q' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v source_ref_q '%q' "$GITHUB_REF"
          printf -v repository_q '%q' "$GITHUB_REPOSITORY"
          printf -v postgres_storage_path_q '%q' "$STAGING_NATIVE_POSTGRES_STORAGE_PATH"
          printf -v allow_first_deploy_q '%q' "$ALLOW_FIRST_DEPLOY"
          printf -v min_free_percent_q '%q' "$STAGING_MIN_DEPLOY_FREE_PERCENT"
          remote_artifact_dir="/tmp/aspb-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-staging"
          printf -v artifact_dir_q '%q' "$remote_artifact_dir"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_key "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "umask 077; mkdir -- $artifact_dir_q"
          cleanup_remote_artifacts() {
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_key "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "rm -f -- $artifact_dir_q/aspb-image-$GITHUB_SHA.tar.gz $artifact_dir_q/aspb-image-$GITHUB_SHA.tar.gz.sha256; rmdir -- $artifact_dir_q 2>/dev/null || true" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote_artifacts EXIT
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_key \
            ".deploy-artifact/aspb-image-$GITHUB_SHA.tar.gz" \
            ".deploy-artifact/aspb-image-$GITHUB_SHA.tar.gz.sha256" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$remote_artifact_dir/"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/staging_key "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- $deploy_path_q $deploy_sha_q $ci_run_url_q $artifact_dir_q $source_ref_q $repository_q $postgres_storage_path_q $allow_first_deploy_q $min_free_percent_q" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          deploy_sha="$2"
          ci_run_url="$3"
          artifact_dir="$4"
          source_ref="$5"
          github_repository="$6"
          native_postgres_storage_path="$7"
          allow_first_deploy="$8"
          min_free_percent="$9"
          if [[ ! "$artifact_dir" =~ ^/tmp/aspb-deploy-[0-9]+-[0-9]+-staging$ ]]; then
            echo "Invalid staging artifact directory: $artifact_dir" >&2
            exit 1
          fi
          if [[ "$native_postgres_storage_path" != /* || ! -d "$native_postgres_storage_path" ]]; then
            echo "Invalid staging native PostgreSQL storage path: $native_postgres_storage_path" >&2
            exit 1
          fi
          if [[ "$allow_first_deploy" != "on" && "$allow_first_deploy" != "off" ]]; then
            echo "Invalid staging first-deploy flag" >&2
            exit 1
          fi
          if [[ ! "$min_free_percent" =~ ^[1-9][0-9]?$ ]] || (( min_free_percent > 99 )); then
            echo "Invalid staging minimum free-space percentage" >&2
            exit 1
          fi
          image_archive="$artifact_dir/aspb-image-$deploy_sha.tar.gz"
          image_checksum="$image_archive.sha256"
          cleanup_artifacts() {
            rm -f -- "$image_archive" "$image_checksum"
            rmdir -- "$artifact_dir" 2>/dev/null || true
          }
          trap cleanup_artifacts EXIT
          command -v flock >/dev/null 2>&1 || { echo "flock is required" >&2; exit 1; }
          deploy_lock_file=/tmp/aspb-autowebinar-deploy.lock
          exec 9>"$deploy_lock_file"
          if ! flock -n 9; then
            echo "Another deployment is already running (lock: $deploy_lock_file)" >&2
            exit 75
          fi
          cd "$deploy_path"
          staging_container_prefix="$(sed -n 's/^ASPB_CONTAINER_PREFIX=//p' .env.production | tail -n 1)"
          staging_bind_port="$(sed -n 's/^ASPB_BIND_PORT=//p' .env.production | tail -n 1)"
          staging_database_url="$(sed -n 's/^DATABASE_URL=//p' .env.production | tail -n 1)"
          if [[ "$staging_container_prefix" != "aspb-platform-staging" || "$staging_bind_port" != "5176" ]]; then
            echo "STAGING container/port isolation is not provisioned" >&2
            exit 1
          fi
          if [[ "$staging_database_url" != *"/aspb_staging?"* || "$staging_database_url" == *"aspb_autowebinar"* ]]; then
            echo "STAGING database isolation is not provisioned" >&2
            exit 1
          fi
          dirty_worktree="$(git status --porcelain=v1 --untracked-files=all -- . \
            ':(exclude)backups/**' \
            ':(exclude)test-results/**' \
            ':(exclude)playwright-report/**' \
            ':(exclude)blob-report/**' \
            ':(exclude)outputs/**')"
          if [ -n "$dirty_worktree" ]; then
            echo "Refusing deploy from a worktree with tracked or untracked source changes:" >&2
            printf '%s\n' "$dirty_worktree" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$deploy_sha"
          git checkout --detach "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          bash scripts/assert-clean-deploy-worktree.sh
          COMPOSE_ENV_FILE=.env.production BACKUP_DIR=backups \
            bash scripts/create-deploy-backup.sh
          verified_backup_file="$(find backups -maxdepth 1 -type f -name 'aspb-postgres-*.sql.gz' -print | sort | tail -n 1)"
          if [ -z "$verified_backup_file" ]; then
            echo "No pre-deploy PostgreSQL backup found in $deploy_path/backups" >&2
            exit 1
          fi
          COMPOSE_FILE=docker-compose.native-postgres.yml \
          COMPOSE_ENV_FILE=.env.production \
          COMPOSE_PROJECT_NAME=aspb-platform-staging \
          ASPB_CONTAINER_PREFIX=aspb-platform-staging \
          ASPB_BIND_PORT=5176 \
          DEPLOY_COMMIT_SHA="$deploy_sha" \
          DEPLOY_VERIFIED_CI_SHA="$deploy_sha" \
          DEPLOY_VERIFIED_CI_RUN_URL="$ci_run_url" \
          DEPLOY_GITHUB_REPOSITORY="$github_repository" \
          DEPLOY_SOURCE_REF="$source_ref" \
          DEPLOY_ENVIRONMENT=staging \
          DEPLOY_LOCK_HELD=on \
          DEPLOY_PREBUILT_IMAGES=on \
          DEPLOY_IMAGE_ARCHIVE="$image_archive" \
          DEPLOY_IMAGE_CHECKSUM_FILE="$image_checksum" \
          NATIVE_POSTGRES_STORAGE_PATH="$native_postgres_storage_path" \
          VERIFIED_BACKUP_FILE="$verified_backup_file" \
          MIN_DEPLOY_FREE_PERCENT="$min_free_percent" \
          ALLOW_DEPLOY_WITHOUT_ROLLBACK="$allow_first_deploy" \
            bash scripts/deploy-production.sh
          REMOTE
          trap - EXIT
          cleanup_remote_artifacts

  staging-smoke:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production'))
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    concurrency:
      group: staging-acceptance
      cancel-in-progress: false
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2

      - name: Require staging acceptance configuration
        env:
          STAGING_PUBLIC_URL: ${{ needs.deploy-staging.outputs.public_url }}
          ASPB_STAGING_ALLOWED_HOST: ${{ needs.deploy-staging.outputs.allowed_host }}
        run: |
          if [ -z "$STAGING_PUBLIC_URL" ] || [ -z "$ASPB_STAGING_ALLOWED_HOST" ]; then
            echo "Staging acceptance requires STAGING_PUBLIC_URL and STAGING_ALLOWED_HOST." >&2
            exit 1
          fi

      - name: Verify deployed staging health and readiness
        env:
          STAGING_PUBLIC_URL: ${{ needs.deploy-staging.outputs.public_url }}
          ASPB_STAGING_ALLOWED_HOST: ${{ needs.deploy-staging.outputs.allowed_host }}
          ASPB_ALLOW_STAGING_ACCEPTANCE: on
        run: >-
          node scripts/staging/smoke.mjs
          --execute
          --url="$STAGING_PUBLIC_URL"
          --report=artifacts/staging-acceptance/smoke.json

      - name: Upload staging smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-smoke-${{ github.sha }}
          path: artifacts/staging-acceptance/smoke.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    needs:
      [sast, secret-scan, verify, e2e, dependency-audit, iac-validate, container-build, deploy-staging, staging-smoke]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download verified deploy image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aspb-image-${{ github.sha }}
          path: .deploy-artifact

      - name: Require production deployment configuration
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH: ${{ secrets.PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH }}
        run: |
          for value in "$PRODUCTION_SSH_HOST" "$PRODUCTION_SSH_USER" "$PRODUCTION_SSH_KEY" "$PRODUCTION_DEPLOY_PATH" "$PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH"; do
            if [ -z "$value" ]; then
              echo "Production deploy configuration is incomplete; all PRODUCTION_* secrets are required." >&2
              exit 1
            fi
          done

      - name: Deploy verified commit to production over SSH
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH: ${{ secrets.PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH }}
          ALLOW_FIRST_DEPLOY: ${{ inputs.allow_first_deploy && 'on' || 'off' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          printf -v deploy_path_q '%q' "$PRODUCTION_DEPLOY_PATH"
          printf -v deploy_sha_q '%q' "$GITHUB_SHA"
          printf -v ci_run_url_q '%q' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v source_ref_q '%q' "$GITHUB_REF"
          printf -v repository_q '%q' "$GITHUB_REPOSITORY"
          printf -v postgres_storage_path_q '%q' "$PRODUCTION_NATIVE_POSTGRES_STORAGE_PATH"
          printf -v allow_first_deploy_q '%q' "$ALLOW_FIRST_DEPLOY"
          remote_artifact_dir="/tmp/aspb-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-production"
          printf -v artifact_dir_q '%q' "$remote_artifact_dir"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/production_key "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "umask 077; mkdir -- $artifact_dir_q"
          cleanup_remote_artifacts() {
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/production_key "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
              "rm -f -- $artifact_dir_q/aspb-image-$GITHUB_SHA.tar.gz $artifact_dir_q/aspb-image-$GITHUB_SHA.tar.gz.sha256; rmdir -- $artifact_dir_q 2>/dev/null || true" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote_artifacts EXIT
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/production_key \
            ".deploy-artifact/aspb-image-$GITHUB_SHA.tar.gz" \
            ".deploy-artifact/aspb-image-$GITHUB_SHA.tar.gz.sha256" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$remote_artifact_dir/"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/production_key "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "bash -s -- $deploy_path_q $deploy_sha_q $ci_run_url_q $artifact_dir_q $source_ref_q $repository_q $postgres_storage_path_q $allow_first_deploy_q" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          deploy_sha="$2"
          ci_run_url="$3"
          artifact_dir="$4"
          source_ref="$5"
          github_repository="$6"
          native_postgres_storage_path="$7"
          allow_first_deploy="$8"
          if [[ ! "$artifact_dir" =~ ^/tmp/aspb-deploy-[0-9]+-[0-9]+-production$ ]]; then
            echo "Invalid production artifact directory: $artifact_dir" >&2
            exit 1
          fi
          if [[ "$native_postgres_storage_path" != /* || ! -d "$native_postgres_storage_path" ]]; then
            echo "Invalid production native PostgreSQL storage path: $native_postgres_storage_path" >&2
            exit 1
          fi
          if [[ "$allow_first_deploy" != "on" && "$allow_first_deploy" != "off" ]]; then
            echo "Invalid production first-deploy flag" >&2
            exit 1
          fi
          image_archive="$artifact_dir/aspb-image-$deploy_sha.tar.gz"
          image_checksum="$image_archive.sha256"
          cleanup_artifacts() {
            rm -f -- "$image_archive" "$image_checksum"
            rmdir -- "$artifact_dir" 2>/dev/null || true
          }
          trap cleanup_artifacts EXIT
          command -v flock >/dev/null 2>&1 || { echo "flock is required" >&2; exit 1; }
          deploy_lock_file=/tmp/aspb-autowebinar-deploy.lock
          exec 9>"$deploy_lock_file"
          if ! flock -n 9; then
            echo "Another deployment is already running (lock: $deploy_lock_file)" >&2
            exit 75
          fi
          cd "$deploy_path"
          dirty_worktree="$(git status --porcelain=v1 --untracked-files=all -- . \
            ':(exclude)backups/**' \
            ':(exclude)test-results/**' \
            ':(exclude)playwright-report/**' \
            ':(exclude)blob-report/**' \
            ':(exclude)outputs/**')"
          if [ -n "$dirty_worktree" ]; then
            echo "Refusing deploy from a worktree with tracked or untracked source changes:" >&2
            printf '%s\n' "$dirty_worktree" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$deploy_sha"
          git checkout --detach "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          bash scripts/assert-clean-deploy-worktree.sh
          COMPOSE_ENV_FILE=.env.production BACKUP_DIR=backups \
            bash scripts/create-deploy-backup.sh
          verified_backup_file="$(find backups -maxdepth 1 -type f -name 'aspb-postgres-*.sql.gz' -print | sort | tail -n 1)"
          if [ -z "$verified_backup_file" ]; then
            echo "No pre-deploy PostgreSQL backup found in $deploy_path/backups" >&2
            exit 1
          fi
          COMPOSE_FILE=docker-compose.native-postgres.yml \
          COMPOSE_ENV_FILE=.env.production \
          DEPLOY_COMMIT_SHA="$deploy_sha" \
          DEPLOY_VERIFIED_CI_SHA="$deploy_sha" \
          DEPLOY_VERIFIED_CI_RUN_URL="$ci_run_url" \
          DEPLOY_GITHUB_REPOSITORY="$github_repository" \
          DEPLOY_SOURCE_REF="$source_ref" \
          DEPLOY_ENVIRONMENT=production \
          DEPLOY_LOCK_HELD=on \
          DEPLOY_PREBUILT_IMAGES=on \
          DEPLOY_IMAGE_ARCHIVE="$image_archive" \
          DEPLOY_IMAGE_CHECKSUM_FILE="$image_checksum" \
          NATIVE_POSTGRES_STORAGE_PATH="$native_postgres_storage_path" \
          VERIFIED_BACKUP_FILE="$verified_backup_file" \
          ALLOW_DEPLOY_WITHOUT_ROLLBACK="$allow_first_deploy" \
            bash scripts/deploy-production.sh
          REMOTE
          trap - EXIT
          cleanup_remote_artifacts

  lint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
