        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { description: Private no-store resume projection }
        '404': { description: Unknown, expired, foreign or unauthorized upload }
