      security:
        - userSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CRMContactId'
      responses:
        '200':
          description: Private no-store CRM contact, registrations and ordered timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CRMContactDetail' }
        '403': { description: Active membership role cannot read CRM }
