      responses:
        '200': { description: Private no-store task projection without recipient or provider data }
        '403': { description: Active membership is not OWNER or AUTHOR }
        '404': { description: Creator dashboard rollout is unavailable }
  /api/v1/creator/webinars/{webinarId}/readiness:
    get:
