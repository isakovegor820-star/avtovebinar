services:
  postgres:
    image: postgres:16-alpine
    container_name: aspb-autowebinar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aspb
      POSTGRES_DB: aspb_autowebinar
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - aspb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspb -d aspb_autowebinar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aspb_postgres_data:
