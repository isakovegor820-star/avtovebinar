global:
  resolve_timeout: 5m
route:
  receiver: placeholder-null-receiver
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: placeholder-critical-receiver
receivers:
  - name: placeholder-null-receiver
  - name: placeholder-critical-receiver
    webhook_configs:
      - url: https://placeholder.invalid/replace-from-secret-store
        send_resolved: true
