x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  api:
    image: aspb-autowebinar-api:${DEPLOY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT_SHA: ${DEPLOY_COMMIT_SHA:-local}
    container_name: aspb-autowebinar-api
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.production}
    environment:
      WORKER_ROLE: api
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MEDIA_LOCAL_ROOT: /var/lib/aspb/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - aspb_media_prod_data:/var/lib/aspb/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-5174}/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  webinar-worker:
    image: aspb-autowebinar-worker:${DEPLOY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT_SHA: ${DEPLOY_COMMIT_SHA:-local}
    container_name: aspb-autowebinar-worker
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.production}
    environment:
      WORKER_ROLE: webinar
      MEDIA_LOCAL_ROOT: /var/lib/aspb/media
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "scripts/run-worker-with-watchdog.mjs"]
    volumes:
      - aspb_media_prod_data:/var/lib/aspb/media
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: aspb-autowebinar-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aspb_autowebinar}
    volumes:
      - aspb_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aspb} -d $${POSTGRES_DB:-aspb_autowebinar}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  aspb_postgres_prod_data:
  aspb_media_prod_data:
