services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aspb-autowebinar-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WORKER_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-5174}/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  webinar-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aspb-autowebinar-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WORKER_ROLE: webinar
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: aspb-autowebinar-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aspb_autowebinar}
    volumes:
      - aspb_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aspb} -d $${POSTGRES_DB:-aspb_autowebinar}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aspb_postgres_prod_data:
